dynamicPackageExtensions: ./scripts/dynamic.extensions.mts

enableGlobalCache: false

enableScripts: false

globalFolder: .yarn/store

logFilters:
  - code: YN0060
    level: discard

nodeLinker: pnpm

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  - "@microsoft/esrp-npm-release"

packageExtensions:
  "@svgr/core@*":
    dependencies:
      "@svgr/plugin-jsx": "*"
      "@svgr/plugin-svgo": "*"
  "@storybook/react-native@10.5.4":
    dependencies:
      esbuild: "0.28.1"
  "@wdio/appium-service@*":
    dependencies:
      appium: "*"
  "@wdio/jasmine-framework@*":
    dependencies:
      expect-webdriverio: "*"
  "@wdio/runner@*":
    dependencies:
      expect-webdriverio: "*"
  appium-mac2-driver@*:
    dependencies:
      appium: "*"
  appium-uiautomator2-driver@*:
    dependencies:
      appium: "*"
  appium-webdriveragent@*:
    dependencies:
      appium-xcode: "*"
  appium-windows-driver@*:
    dependencies:
      appium: "*"
  appium-xcuitest-driver@*:
    dependencies:
      appium: "*"
  devtools@6.12.1:
    dependencies:
      debug: ^4.4.3
  appium@*:
    dependencies:
      "@colors/colors": "*"
      appium-mac2-driver: "*"
      appium-uiautomator2-driver: "*"
      appium-windows-driver: "*"
      appium-xcuitest-driver: "*"
  expect-webdriverio@*:
    dependencies:
      "@wdio/globals": "*"
      "@wdio/logger": "*"
      webdriverio: "*"
  iconv-lite@*:
    dependencies:
      iconv-lite: "*"
  react-native-svg-transformer@*:
    peerDependencies:
      "@react-native/metro-babel-transformer": "*"
  react-native-svg@*:
    dependencies:
      buffer: "*"
  zx@*:
    dependencies:
      "@types/fs-extra": "*"

