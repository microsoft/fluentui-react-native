dynamicPackageExtensions: ./scripts/dynamic.extensions.mts

enableGlobalCache: false

enableScripts: false

globalFolder: .yarn/store

logFilters:
  - code: YN0060
    level: discard

nodeLinker: pnpm

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  - "@microsoft/esrp-npm-release"

packageExtensions:
  "@svgr/core@*":
    dependencies:
      "@svgr/plugin-jsx": "*"
      "@svgr/plugin-svgo": "*"
  # @storybook/react-native loads stories through esbuild-register, whose esbuild peer it does not provide.
  "@storybook/react-native@^10":
    dependencies:
      esbuild: "0.28.1"
  # expect-webdriverio 8 reaches webdriverio and @wdio/types only through its type declarations. Link them so TypeScript
  # resolves them under the pnpm linker without every consumer declaring them.
  expect-webdriverio@*:
    dependencies:
      "@wdio/types": "*"
      webdriverio: "*"
    peerDependenciesMeta:
      "@wdio/types":
        optional: true
  iconv-lite@*:
    dependencies:
      iconv-lite: "*"
  # The Lage patch uses cross-spawn for Windows command shims without DEP0190.
  lage@2.14.19:
    dependencies:
      cross-spawn: "7.0.6"
  react-native-svg-transformer@*:
    peerDependencies:
      "@react-native/metro-babel-transformer": "*"
  react-native-svg@*:
    dependencies:
      buffer: "*"
  zx@*:
    dependencies:
      "@types/fs-extra": "*"

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-compat.cjs
    spec: "@yarnpkg/plugin-compat"
  - checksum: 7a8601ccc6985f33d41b7fb5e2f4a431cc5cda36ba9c0906326cb18230933042366bdec1551ebd41a3787f162e72a8da3cb4367b63f275ea9b66c3fdcf0666b0
