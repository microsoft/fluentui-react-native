version: 1
purpose: Agent-optimized map of stable Storybook structure and runtime discovery paths.

sources:
  config: desktop.config.mts
  config_adapter: src/main.ts
  app_entry: index.js
  app_shell: src/StorybookApp.tsx
  theme_host: ../../packages/agentic/storybook-desktop-runtime/src/StorybookTheme.tsx
  theme_palette: ../../packages/agentic/storybook-desktop-runtime/src/useStorybookTheme.ts
  shared_cli: ../../packages/agentic/storybook-desktop
  shared_harness: ../../packages/agentic/desktop-test
  shared_runtime: ../../packages/agentic/storybook-desktop-runtime
  generated_requires:
    path: src/storybook.requires.ts
    policy: generated-do-not-edit
  story_packages:
    - '@fluentui-react-native/components'
    - '@fluentui-react-native/native-core'

services:
  supervisor:
    command: yarn storybook driver --<platform>
    owns:
      - metro
      - storybook-channel
      - desktop-driver
  instance:
    command: yarn storybook instance --<platform>
    policy: use-reported-ports-and-target-id
  executable_tests:
    command: yarn storybook test --<platform>
    discovery: yarn storybook test --<platform> --list
    authoring: top-level wdio callbacks or named callback collections in CSF3 stories
    config: desktop.config.mts Storybook integration wdio settings
    lifecycle: attached-session-per-test-with-isolated-node-worker
    context_platform: macos-or-windows-or-win32-target-endpoint
    test_filter: --test <name-glob>
    smoke_mode: stories-and-tests
    execution: navigate-and-remount-then-run-tests-grouped-by-story

agent_commands:
  generate_manifest: yarn storybook manifest --<platform>
  start_driver: yarn storybook driver --<platform>
  inspect_instance: yarn storybook instance --<platform>
  list_stories: yarn desktop-driver stories list --url <driver-url> --target <target-id>
  run_story_tests: yarn storybook test --<platform> --test <test-name-glob>

lookup_order:
  - Generate the exact platform manifest; never guess ID slugging.
  - Read this map for stable paths, services, and commands.
  - Read desktop.config.mts for story-package and platform changes.
  - Read a matched story file for component-specific behavior.
  - Read generated requires only to diagnose generation output.

interaction_order:
  - Use desktop-driver stories list for runtime story IDs and storybook test for authored callbacks.
  - Use accessibility elements for native focus and control state.
  - Use screenshots for visual evidence, not element lookup.

native:
  driver:
    build: yarn storybook build-driver --<platform>
    doctor: yarn desktop-driver doctor --platform <platform>
    cache_env: FURN_DESKTOP_DRIVER_CACHE_ROOT
    disabled_input_env: FURN_DESKTOP_DRIVER_DISABLED_INPUT_FEATURES
    ci_policy: explicit-build-then-prebuilt-only
  macos:
    renderer:
      default: fabric
      paper_flag: --paper
      switching: rerun-prep-before-build-or-launch
      concurrency: one-renderer-per-enlistment
    process: ReactTestApp
    app_bundle: macos/DerivedData/Build/Products/Debug/ReactTestApp.app
    coordinate_notes:
      accessibility: logical-points
      screenshots: backing-pixels
      rule: Query element bounds and display scale; do not copy screenshot coordinates.
  windows:
    project_policy: generated
    generation_command: yarn storybook prep --windows
    helper_provider: windows-x64
  win32:
    host: prebuilt-rex
    build_policy: unsupported
    bundle_command: yarn storybook bundle --win32
    helper_provider: windows-x64

validation:
  javascript:
    - format
    - lint
    - yarn storybook manifest --<platform>
    - yarn storybook bundle --<platform>
  native:
    normal: yarn storybook build --<platform>
    lifecycle: yarn storybook smoke --<platform> --mode stories-and-tests

output_hygiene:
  - Canonical reports and source-attributed command logs live under artifacts/desktop/<run-id>.
  - Stderr and test progress are live; --verbose also streams informational output.
  - Logs preserve collector arrival order across streams; failures replay grouped output.
  - Use structured CLI output instead of logging raw channel events.
  - Search large native build logs for errors and final status instead of reading them in full.
  - Keep warning suppression exact; console diagnostics remain available even when LogBox hides a warning.
