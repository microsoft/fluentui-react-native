name: Changesets Version Bump

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    name: Create Version Bump PR
    runs-on: ubuntu-latest

    if: ${{ github.repository == 'microsoft/fluentui-react-native' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@c75754b0fedce160a4dcf7193fae1a6ece76efe2 # 5.4.11

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Generate token for version PR
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write # for GH releases and Git tags (Changesets)
          permission-pull-requests: write # version PRs (Changesets)

      - name: Create Version Bump PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: yarn changeset:version
          create-github-releases: false
          push-git-tags: false
          push-with-git-cli: true
