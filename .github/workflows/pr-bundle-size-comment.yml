name: Bundle Size PR Comment

on:
  workflow_run:
    workflows: [PR]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: bundle-size-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Publish trusted bundle-size report
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Find bundle-size artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          found=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --jq '[.[].artifacts[]] | any(.name == "bundle-size-analysis" and .expired == false)')
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [[ "$found" != "true" ]]; then
            echo "No bundle-size artifact for this attempt; report-only verification runs do not rebuild bundles." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download bundle-size report
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-size-analysis
          path: bundle-size-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate downloaded bundle size report
        if: steps.artifact.outputs.found == 'true'
        run: node apps/bundle-size/scripts/validate-report.mts bundle-size-analysis/report.md

      - name: Publish bundle size PR comment
        if: steps.artifact.outputs.found == 'true'
        env:
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER_PATH: bundle-size-analysis/pull-request-number.txt
          REPORT_PATH: bundle-size-analysis/report.md
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node apps/bundle-size/scripts/post-pr-comment.mts
