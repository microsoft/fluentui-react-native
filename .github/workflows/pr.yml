name: PR
on: pull_request

permissions:
  contents: read

env:
  VisualStudioVersion: '18.0'
  WindowsTargetPlatformVersion: '10.0.26100.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assessment-inputs:
    name: Validate assessment inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      report-only: ${{ steps.verify.outputs.report-only || steps.inspect.outputs.report-only || 'false' }}
      source-result: ${{ steps.verify.outputs.source-result }}
    steps:
      - name: Checkout trusted input validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Inspect report-only candidate
        id: inspect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/src/tasks/controlAssessmentCiTask.ts ]]; then
            node scripts/src/tasks/controlAssessmentCiTask.ts inspect
          else
            echo "candidate=false" >> "$GITHUB_OUTPUT"
            echo "report-only=false" >> "$GITHUB_OUTPUT"
            echo "Trusted assessment validator is not on the base branch yet. Running all normal source checks." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download original assessment evidence
        if: steps.inspect.outputs.candidate == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.inspect.outputs.artifact-name }}
          path: ${{ runner.temp }}/checkbox-source-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.inspect.outputs.run-id }}

      - name: Verify unchanged inputs and generated report plus SPEC assessment fields
        id: verify
        if: steps.inspect.outputs.candidate == 'true'
        env:
          CANDIDATE_PATH: ${{ steps.inspect.outputs.candidate-path }}
          BUNDLE_PATH: ${{ runner.temp }}/checkbox-source-evidence/bundle.json
        run: node scripts/src/tasks/controlAssessmentCiTask.ts verify

  js:
    name: JS PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      unit-artifact: ${{ steps.unit-evidence.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Test agent permissions
        run: yarn test:agent-permissions

      - name: Capture existing component test inputs
        run: node scripts/src/tasks/controlAssessmentCiTask.ts begin-unit

      - name: Build CI
        env:
          FURN_ASSESSMENT_UNIT_CAPTURE: ${{ github.workspace }}/apps/storybook/artifacts/assessment-unit-ci
        run: yarn lage buildci

      - name: Upload existing component unit evidence
        id: unit-evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkbox-unit-evidence-${{ github.run_attempt }}
          path: apps/storybook/artifacts/assessment-unit-ci
          if-no-files-found: warn
          retention-days: 14

  bundle-size:
    name: Bundle Size PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Read base branch bundle baseline
        shell: powershell
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $baseline = "$env:RUNNER_TEMP\bundle-size-baseline.json"
          $baselinePath = 'apps/bundle-size/baseline.json'
          $baselineExists = git ls-tree --name-only $env:BASE_SHA -- $baselinePath
          if ($baselineExists) {
            git show "$env:BASE_SHA`:apps/bundle-size/baseline.json" | Out-File -FilePath $baseline -Encoding utf8
          } else {
            Copy-Item $baselinePath $baseline
          }

      - name: Measure bundle sizes
        run: yarn bundle-size --baseline "$env:RUNNER_TEMP\bundle-size-baseline.json"

      - name: Validate bundle size report
        run: yarn workspace @fluentui-react-native/bundle-size validate-report

      - name: Publish bundle size summary
        run: Get-Content apps\bundle-size\dist\bundle-size\report.md -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Publish bundle size PR comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_PATH: apps/bundle-size/dist/bundle-size/report.md
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: node apps/bundle-size/scripts/post-pr-comment.mts

      - name: Add pull request metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: Set-Content apps\bundle-size\dist\bundle-size\pull-request-number.txt $env:PR_NUMBER -NoNewline

      - name: Upload bundle analysis
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-size-analysis
          path: apps/bundle-size/dist/bundle-size
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          platform: android
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Bundle Android
        run: yarn bundle:android
        working-directory: apps/legacy-mobile

  macos:
    name: macOS PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          platform: macos
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      # Hosted macOS clicks use accessibility actions, as in the Storybook job; keyboard and wheel stay enabled.
      - name: Set up macOS Desktop Driver
        id: desktop-driver
        uses: ./.github/actions/setup-desktop-driver
        with:
          platform: macos
          disabled-input-features: physicalClick

      - name: Prepare E2E macOS tests
        run: yarn e2eprep:macos
        working-directory: apps/fluent-tester
        env:
          CCACHE_DISABLE: 1

      - name: Run E2E macOS tests
        run: yarn e2etest:macos
        working-directory: apps/fluent-tester

      - name: Upload E2E macOS artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: E2E_macos_fabric_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            apps/E2E/artifacts/desktop
            apps/fluent-tester/artifacts/desktop
            ${{ steps.desktop-driver.outputs.doctor-path }}

  macos-storybook:
    name: macOS Storybook PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          platform: macos
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Set up macOS Desktop Driver
        id: desktop-driver
        uses: ./.github/actions/setup-desktop-driver
        with:
          platform: macos
          disabled-input-features: physicalClick

      - name: Bundle macOS
        run: |
          set -eox pipefail
          yarn storybook bundle --macos
        working-directory: apps/storybook

      - name: Pod install
        run: yarn storybook prep --macos
        working-directory: apps/storybook

      - name: Run through storybook smoke tests
        run: yarn storybook smoke --macos --mode stories-and-tests
        working-directory: apps/storybook
        env:
          CCACHE_DISABLE: 1

      - name: Upload macOS Storybook artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Storybook_macos_fabric_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            apps/storybook/artifacts/macos
            apps/storybook/artifacts/desktop
            ${{ steps.desktop-driver.outputs.doctor-path }}

  macos-paper-storybook:
    name: macOS Paper Storybook PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          platform: macos
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Set up macOS Desktop Driver
        id: desktop-driver
        uses: ./.github/actions/setup-desktop-driver
        with:
          platform: macos
          disabled-input-features: physicalClick

      - name: Bundle macOS Paper
        run: yarn storybook bundle --macos --paper
        working-directory: apps/storybook

      - name: Pod install (Paper)
        run: yarn storybook prep --macos --paper
        working-directory: apps/storybook

      - name: Run through Paper storybook smoke tests
        run: yarn storybook smoke --macos --paper --mode stories-and-tests
        working-directory: apps/storybook
        env:
          CCACHE_DISABLE: 1

      - name: Upload macOS Paper Storybook artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Storybook_macos_paper_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            apps/storybook/artifacts/macos
            apps/storybook/artifacts/desktop
            ${{ steps.desktop-driver.outputs.doctor-path }}

  ios:
    name: iOS PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          platform: ios
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Bundle iOS
        run: |
          set -eox pipefail
          yarn bundle:ios
        working-directory: apps/legacy-mobile

      - name: Pod install
        run: |
          set -eox pipefail
          pod install --verbose
        working-directory: apps/legacy-mobile/ios

      - name: Build iOS app
        run: ./.github/scripts/xcodebuild.mts apps/legacy-mobile/ios/FluentTester.xcworkspace iphonesimulator ReactTestApp build
        env:
          CCACHE_DISABLE: 1

  windows:
    name: Windows PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          platform: windows
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      # The legacy specs navigate with the keyboard and scroll with the wheel, so unlike the Storybook job
      # every input feature stays enabled.
      - name: Set up Windows Desktop Driver
        id: desktop-driver
        uses: ./.github/actions/setup-desktop-driver
        with:
          platform: windows

      - name: Install Windows App Runtime 1.8
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest 'https://aka.ms/windowsappsdk/1.8/1.8.260804001/windowsappruntimeinstall-x64.exe' -OutFile $installer
          & $installer --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App Runtime installer exited with code $LASTEXITCODE."
          }

          $runtime = Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.1.8'
          if (-not $runtime) {
            throw 'Microsoft.WindowsAppRuntime.1.8 was not registered for the runner user.'
          }

      # Register before launch so first-launch crashes are captured.
      - name: Enable crash dumps
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'crash-dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\ReactApp.exe" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\ReactApp.exe" /v DumpFolder /t REG_EXPAND_SZ /d "$dumps" /f

      - name: Prepare E2E Windows tests
        run: yarn e2eprep:windows
        working-directory: apps/fluent-tester

      - name: Run E2E Windows tests
        run: yarn e2etest:windows
        working-directory: apps/fluent-tester

      - name: Upload E2E Windows artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: E2E_windows_fabric_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            apps/E2E/artifacts/desktop
            apps/fluent-tester/artifacts/desktop
            ${{ runner.temp }}/crash-dumps
            ${{ steps.desktop-driver.outputs.doctor-path }}
            ${{ steps.desktop-driver.outputs.cache-root }}/v1/artifacts/**/build.log
            ${{ steps.desktop-driver.outputs.cache-root }}/v1/diagnostics/**
          if-no-files-found: warn

  windows-storybook:
    name: Windows Storybook PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          platform: windows
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Set up Windows Desktop Driver
        id: desktop-driver
        uses: ./.github/actions/setup-desktop-driver
        with:
          platform: windows
          run-native-contract: 'true'
          disabled-input-features: keyboard,physicalClick,wheel

      - name: Prep Windows Storybook
        run: yarn storybook prep --windows
        working-directory: apps/storybook

      - name: Install Windows App Runtime 1.8
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest 'https://aka.ms/windowsappsdk/1.8/1.8.260804001/windowsappruntimeinstall-x64.exe' -OutFile $installer
          & $installer --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App Runtime installer exited with code $LASTEXITCODE."
          }

          $runtime = Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.1.8'
          if (-not $runtime) {
            throw 'Microsoft.WindowsAppRuntime.1.8 was not registered for the runner user.'
          }

      - name: Smoke test Windows Storybook
        run: yarn storybook smoke --windows --mode stories-and-tests
        working-directory: apps/storybook

      - name: Upload Windows Storybook artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Storybook_windows_fabric_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            apps/storybook/artifacts/windows
            apps/storybook/artifacts/desktop
            ${{ steps.desktop-driver.outputs.doctor-path }}
            ${{ steps.desktop-driver.outputs.cache-root }}/v1/artifacts/**/build.log
            ${{ steps.desktop-driver.outputs.cache-root }}/v1/diagnostics/**
          if-no-files-found: warn

  win32:
    name: Win32 PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          platform: windows
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      # Like the Windows job, this leaves every input feature enabled for the keyboard and wheel specs.
      - name: Set up Win32 Desktop Driver
        id: desktop-driver
        uses: ./.github/actions/setup-desktop-driver
        with:
          platform: win32

      - name: Prepare E2E Win32 tests
        run: yarn e2eprep:win32
        working-directory: apps/win32

      - name: Run E2E Win32 tests
        run: yarn e2etest:win32
        working-directory: apps/win32

      - name: Upload E2E Win32 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: E2E_win32_paper_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            apps/E2E/artifacts/desktop
            apps/win32/artifacts/desktop
            ${{ steps.desktop-driver.outputs.doctor-path }}
            ${{ steps.desktop-driver.outputs.cache-root }}/v1/artifacts/**/build.log
            ${{ steps.desktop-driver.outputs.cache-root }}/v1/diagnostics/**
          if-no-files-found: warn

  win32-storybook:
    name: Win32 Storybook PR
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      native-artifact: ${{ steps.native-evidence.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          platform: windows
          node-version: 24

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Set up Win32 Desktop Driver
        id: desktop-driver
        uses: ./.github/actions/setup-desktop-driver
        with:
          platform: win32
          disabled-input-features: keyboard,physicalClick,wheel

      - name: Capture Checkbox execution inputs
        id: checkbox-inputs
        run: node scripts/src/tasks/controlAssessmentCiTask.ts begin

      - name: Smoke test Win32 Storybook
        id: smoke
        if: ${{ !cancelled() && steps.checkbox-inputs.outcome == 'success' }}
        run: yarn storybook smoke --win32 --mode stories-and-tests
        working-directory: apps/storybook

      - name: Collect Checkbox native evidence
        if: ${{ always() && !cancelled() }}
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: node scripts/src/tasks/controlAssessmentCiTask.ts finish

      - name: Upload Checkbox native evidence
        id: native-evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkbox-native-evidence-${{ github.run_attempt }}
          path: apps/storybook/artifacts/win32/assessment-ci
          if-no-files-found: error
          retention-days: 14

      - name: Upload Win32 Storybook artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Storybook_win32_paper_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            apps/storybook/artifacts/win32
            apps/storybook/artifacts/desktop
            ${{ steps.desktop-driver.outputs.doctor-path }}
            ${{ steps.desktop-driver.outputs.cache-root }}/v1/artifacts/**/build.log
            ${{ steps.desktop-driver.outputs.cache-root }}/v1/diagnostics/**
          if-no-files-found: warn

  control-assessment:
    name: Assess Checkbox evidence
    needs: [assessment-inputs, js, win32-storybook]
    if: ${{ always() && !cancelled() && needs.assessment-inputs.result == 'success' && needs.assessment-inputs.outputs.report-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout assessed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download native evidence
        if: needs.win32-storybook.outputs.native-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checkbox-native-evidence-${{ github.run_attempt }}
          path: apps/storybook/artifacts/win32/assessment-ci

      - name: Download existing unit evidence
        if: needs.js.outputs.unit-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checkbox-unit-evidence-${{ github.run_attempt }}
          path: apps/storybook/artifacts/assessment-unit-ci

      - name: Assess existing results without rerunning tests
        env:
          UNIT_OUTCOME: ${{ needs.js.result }}
          NATIVE_OUTCOME: ${{ needs.win32-storybook.result }}
        run: node scripts/src/tasks/controlAssessmentCiTask.ts combine

      - name: Upload Checkbox assessment
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkbox-win32-assessment-${{ github.run_attempt }}
          path: apps/storybook/artifacts/win32/assessment-ci
          if-no-files-found: error
          retention-days: 14

  check-changesets:
    name: Check for Changesets
    needs: assessment-inputs
    runs-on: ubuntu-latest
    # Skip this check for the version bump PR created by changesets
    if: ${{ needs.assessment-inputs.outputs.report-only != 'true' && github.head_ref != 'changeset-release/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate changesets
        run: yarn change:check

  publish-dry-run-pack:
    name: NPM Publish Dry Run — Pack
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      has-tarballs: ${{ steps.check.outputs.has-tarballs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Pack packages
        run: yarn lage pack --verbose --grouped

      - name: List packed tarballs
        id: check
        run: |
          ls -laR _packed/
          if ls _packed/*/*.tgz > /dev/null 2>&1; then
            echo "has-tarballs=true" >> $GITHUB_OUTPUT
          else
            echo "has-tarballs=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload packed tarballs
        if: steps.check.outputs.has-tarballs == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-tarballs-dry-run
          path: _packed/

  test-links:
    name: Test repo links
    needs: assessment-inputs
    if: needs.assessment-inputs.outputs.report-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Test markdown links
        run: yarn lage test-links --verbose --grouped

  pr-source:
    name: PR source validation
    if: always()
    runs-on: ubuntu-latest
    needs:
      - assessment-inputs
      - js
      - android
      - macos
      - ios
      - windows
      - win32
      - check-changesets
      - publish-dry-run-pack
      - test-links
    steps:
      - name: Preserve reused source result
        if: ${{ needs.assessment-inputs.outputs.report-only == 'true' && needs.assessment-inputs.outputs.source-result != 'success' }}
        run: |
          echo "The original source validation did not pass. A report-only commit cannot turn it green."
          exit 1
      - name: Check for failures or cancellations
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs failed or were cancelled."
          exit 1
      - name: All required jobs passed
        run: echo "All required jobs completed successfully."

  pr:
    name: PR
    if: always()
    runs-on: ubuntu-latest
    needs: [assessment-inputs, pr-source]
    steps:
      - name: Require successful source validation
        if: ${{ needs.assessment-inputs.result != 'success' || needs.pr-source.result != 'success' }}
        run: |
          echo "Source validation or assessment-input validation failed."
          exit 1
      - name: Require same-PR assessment when publishing is enabled
        if: ${{ vars.CONTROL_ASSESSMENT_PUBLISH == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == github.event.repository.default_branch && needs.assessment-inputs.outputs.report-only != 'true' }}
        run: |
          echo "Source CI completed. Waiting for the trusted publisher to commit the Checkbox assessment to this PR."
          echo "The report-only follow-up run must verify that report before this required check can pass."
          exit 1
      - name: Required PR validation passed
        run: echo "Source checks and the applicable assessment-publication requirements passed."
