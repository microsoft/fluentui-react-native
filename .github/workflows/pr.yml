          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
          "FURN_DESKTOP_DRIVER_CACHE_ROOT=$cacheRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and diagnose Win32 Desktop Driver
        shell: pwsh
        working-directory: apps/storybook
        run: |
          $ErrorActionPreference = 'Stop'
          yarn storybook build-driver --win32
          if ($LASTEXITCODE -ne 0) {
            throw "Win32 Desktop Driver build exited with code $LASTEXITCODE."
          }

          $doctorPath = Join-Path $env:RUNNER_TEMP 'desktop-driver-win32-doctor.json'
          $doctorOutput = yarn desktop-driver doctor --platform win32
          $doctorExitCode = $LASTEXITCODE
          $doctorOutput | Set-Content -Path $doctorPath -Encoding utf8
          if ($doctorExitCode -ne 0) {
            throw "Win32 Desktop Driver doctor exited with code $doctorExitCode."
          }

          $report = ($doctorOutput -join [Environment]::NewLine) | ConvertFrom-Json
          if (
            -not $report.ready -or
            $report.result.provider -ne 'windows' -or
            $report.result.architecture -ne 'x64' -or
            $report.result.wireProtocol.major -ne 1 -or
            -not ($report.result.endpoints -contains 'win32')
          ) {
            throw 'The verified helper does not satisfy the Win32 x64 provider contract.'
          }

          "FURN_DESKTOP_DRIVER_BUILD_POLICY=never" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test Win32 Storybook
        run: yarn storybook smoke --win32 --mode stories-and-tests
        working-directory: apps/storybook

      - name: Upload Win32 Storybook artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Storybook_win32_Dump
          path: |
            apps/storybook/artifacts/win32
            ${{ runner.temp }}/desktop-driver-win32-doctor.json
            ${{ runner.temp }}/furn-desktop-driver-native/v1/artifacts/**/build.log
            ${{ runner.temp }}/furn-desktop-driver-native/v1/diagnostics/**
          if-no-files-found: warn

  check-changesets:
    name: Check for Changesets
    runs-on: ubuntu-latest
    # Skip this check for the version bump PR created by changesets
    if: ${{ github.head_ref != 'changeset-release/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate changesets
        run: yarn change:check

  publish-dry-run-pack:
    name: NPM Publish Dry Run — Pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      has-tarballs: ${{ steps.check.outputs.has-tarballs }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@1230975885a9e5d3a2ad58b1483f80b09cec04f2 # 5.2.3
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Pack packages
        run: yarn lage pack --verbose --grouped

      - name: List packed tarballs
        id: check
        run: |
          ls -laR _packed/
          if ls _packed/*/*.tgz > /dev/null 2>&1; then
            echo "has-tarballs=true" >> $GITHUB_OUTPUT
          else
            echo "has-tarballs=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload packed tarballs
        if: steps.check.outputs.has-tarballs == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packed-tarballs-dry-run
          path: _packed/

  test-links:
    name: Test repo links
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@1230975885a9e5d3a2ad58b1483f80b09cec04f2 # 5.2.3
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Test markdown links
        run: yarn lage test-links --verbose --grouped

  pr:
    name: PR
    if: always()
    runs-on: ubuntu-latest
    needs:
      - js
      - android
      - macos
      - ios
      - windows
      - win32
      - check-changesets
      - publish-dry-run-pack
      - test-links
    steps:
      - name: Check for failures or cancellations
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs failed or were cancelled."
          exit 1
      - name: All required jobs passed
        run: echo "All required jobs completed successfully."
