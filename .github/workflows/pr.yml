name: PR
on: pull_request

permissions:
  contents: read

env:
  VisualStudioVersion: '18.0'
  WindowsTargetPlatformVersion: '10.0.26100.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@1230975885a9e5d3a2ad58b1483f80b09cec04f2 # 5.2.3
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build CI
        run: yarn lage buildci

  bundle-size:
    name: Bundle Size PR
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@1230975885a9e5d3a2ad58b1483f80b09cec04f2 # 5.2.3
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Read base branch bundle baseline
        shell: powershell
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $baseline = "$env:RUNNER_TEMP\bundle-size-baseline.json"
          $baselinePath = 'apps/bundle-size/baseline.json'
          $baselineExists = git ls-tree --name-only $env:BASE_SHA -- $baselinePath
          if ($baselineExists) {
            git show "$env:BASE_SHA`:apps/bundle-size/baseline.json" | Out-File -FilePath $baseline -Encoding utf8
          } else {
            Copy-Item $baselinePath $baseline
          }

      - name: Measure bundle sizes
        run: yarn bundle-size --baseline "$env:RUNNER_TEMP\bundle-size-baseline.json"

      - name: Publish bundle size summary
        run: Get-Content apps\bundle-size\dist\bundle-size\report.md -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Publish bundle size PR comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_PATH: apps/bundle-size/dist/bundle-size/report.md
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: node apps/bundle-size/scripts/post-pr-comment.mjs

      - name: Add pull request metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: Set-Content apps\bundle-size\dist\bundle-size\pull-request-number.txt $env:PR_NUMBER -NoNewline

      - name: Upload bundle analysis
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-analysis
          path: apps/bundle-size/dist/bundle-size
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@1230975885a9e5d3a2ad58b1483f80b09cec04f2 # 5.2.3
        with:
          platform: android
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Bundle Android
        run: yarn bundle:android
        working-directory: apps/fluent-tester

      # Android E2E tests are currently disabled
      # - name: Build Android APK
      #   ...
      # - name: Run E2E Android tests
      #   ...

  macos:
    name: macOS PR
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@1230975885a9e5d3a2ad58b1483f80b09cec04f2 # 5.2.3
        with:
          platform: macos
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Bundle macOS
        run: |
          set -eox pipefail
          yarn bundle:macos
        working-directory: apps/fluent-tester

      - name: Pod install
        run: |
          set -eox pipefail
          pod install --verbose
        working-directory: apps/fluent-tester/macos

      - name: Build macOS app
        run: ./.github/scripts/xcodebuild.mts apps/fluent-tester/macos/FluentTester.xcworkspace macosx ReactTestApp build
        env:
          CCACHE_DISABLE: 1

      # Disable macOS E2E test to unblock 0.81 checkin
      - name: Prepare E2E macOS tests
        run: yarn e2eprep:macos
        working-directory: apps/E2E

      - name: Run E2E macOS tests
        run: yarn e2etest:macos
        working-directory: apps/E2E

      - name: Upload E2E macOS artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: E2E_macos_Dump
          path: |
            apps/E2E/reports
            apps/E2E/errorShots

  macos-storybook:
    name: macOS Storybook PR
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up toolchain
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@1230975885a9e5d3a2ad58b1483f80b09cec04f2 # 5.2.3
        with:
          platform: macos
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Configure Desktop Driver signing
        shell: bash
        run: |
          set -euo pipefail

          signing_root="$RUNNER_TEMP/furn-desktop-driver-signing"
          keychain_path="$signing_root/furn-desktop-driver-ci.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          mkdir -p "$signing_root"
          echo "::add-mask::$keychain_password"

          cat > "$signing_root/openssl.cnf" <<'OPENSSL_CONFIG'
          [req]
          distinguished_name = distinguished_name
          x509_extensions = code_signing
          prompt = no

          [distinguished_name]
          CN = FURN Desktop Driver CI

          [code_signing]
          basicConstraints = critical,CA:true
          keyUsage = critical,digitalSignature,keyCertSign
          extendedKeyUsage = codeSigning
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid:always
          OPENSSL_CONFIG

          openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes \
            -config "$signing_root/openssl.cnf" \
            -keyout "$signing_root/key.pem" \
            -out "$signing_root/certificate.pem"

          pkcs12_compatibility=()
          if openssl pkcs12 -help 2>&1 | grep -q -- "-legacy"; then
            pkcs12_compatibility=(-legacy)
          fi
          openssl pkcs12 -export "${pkcs12_compatibility[@]}" \
            -inkey "$signing_root/key.pem" \
            -in "$signing_root/certificate.pem" \
            -name "FURN Desktop Driver CI" \
            -out "$signing_root/identity.p12" \
            -passout "pass:$keychain_password"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$signing_root/identity.p12" \
            -k "$keychain_path" \
            -P "$keychain_password" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security add-trusted-cert -d -r trustRoot \
            -k "$keychain_path" \
            "$signing_root/certificate.pem"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain="${existing_keychain#*\"}"
            existing_keychain="${existing_keychain%\"}"
            if [[ -n "$existing_keychain" && "$existing_keychain" != "$keychain_path" ]]; then
              existing_keychains+=("$existing_keychain")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk '/"FURN Desktop Driver CI"/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "The Desktop Driver CI code-signing identity is unavailable." >&2
            exit 1
          fi
          echo "FURN_DESKTOP_DRIVER_MACOS_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "FURN_DESKTOP_DRIVER_CACHE_ROOT=$RUNNER_TEMP/furn-desktop-driver-native" >> "$GITHUB_ENV"

      - name: Build and diagnose the macOS Desktop Driver
        working-directory: apps/storybook
        run: |
          set -euo pipefail

          yarn storybook build-driver --macos
          # Hosted CI reports actual TCC authority; it must not prompt or mutate the permission database.
          yarn desktop-driver doctor --platform macos --permissions |
            tee "$RUNNER_TEMP/desktop-driver-macos-doctor.json"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const report = JSON.parse(
            fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'desktop-driver-macos-doctor.json'), 'utf8'),
          );
          if (!report.ready || report.result?.signing?.mode !== 'signed') {
            throw new Error('The macOS Desktop Driver helper is not ready with a stable signature.');
          }
          if (report.result.signing.certificateHash !== process.env.FURN_DESKTOP_DRIVER_MACOS_SIGNING_IDENTITY) {
            throw new Error('The verified helper certificate does not match the configured CI signing identity.');
          }
          if (report.permissions?.schemaVersion !== 1 || report.permissions?.type !== 'permissions') {
            throw new Error('The macOS Desktop Driver permission diagnostic is missing or unsupported.');
          }
          NODE

      - name: Bundle macOS
        run: |
          set -eox pipefail
          yarn storybook bundle --macos
        working-directory: apps/storybook

      - name: Pod install
        run: yarn storybook prep --macos
        working-directory: apps/storybook

      - name: Run through storybook smoke tests
        run: yarn storybook smoke --macos --mode stories-and-tests
        working-directory: apps/storybook
        env:
          CCACHE_DISABLE: 1

      - name: Upload macOS Storybook artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Storybook_macos_Dump
          path: |
            apps/storybook/artifacts/macos
            ${{ runner.temp }}/desktop-driver-macos-doctor.json

  ios:
