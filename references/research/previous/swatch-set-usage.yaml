  SliderPrimary:
    control_family: slider
    usage: >-
      Primary rendering color of a slider in its resting state.
      Apply to the parts designated primary by that slider's style.
  SliderPrimaryHover:
    control_family: slider
    usage: >-
      Primary rendering color of a slider while hovered.
      Apply to the same primary parts that use SliderPrimary at rest.
  SliderPrimaryPressed:
    control_family: slider
    usage: >-
      Primary rendering color of a slider while pressed.
      Apply to the same primary parts that use SliderPrimary at rest.
  SliderPrimaryDisabled:
    control_family: slider
    usage: >-
      Primary rendering color of a disabled slider.
      Apply to the primary parts, not to unrelated disabled controls.
  SliderSecondary:
    control_family: slider
    usage: >-
      Secondary rendering color of a slider.
      The definition does not prescribe a universal thumb-versus-track split;
      use the primary/secondary assignments of the slider's style.
  SliderBuffer:
    control_family: slider
    usage: >-
      Color of a slider's buffer region or buffer indication.
      Use for buffered content, not as a generic slider background.
  SliderKeyboard:
    control_family: slider
    usage: >-
      Keyboard-focus color in a slider's focus treatment.
      Use when the slider has keyboard focus rather than simply being hovered.
  SliderToolTipBorder:
    control_family: slider
    usage: >-
      Border of a slider's tooltip, paired with SliderToolTipBkg and
      SliderToolTipLabel rather than a generic tooltip treatment.
  SliderToolTipLabel:
    control_family: slider
    usage: >-
      Label text in a slider's tooltip, rendered on SliderToolTipBkg.
      This is distinct from the slider's primary and secondary rendering colors.
  SliderToolTipBkg:
    control_family: slider
    usage: >-
      Background of a slider's tooltip.
      Pair with SliderToolTipLabel and SliderToolTipBorder.
