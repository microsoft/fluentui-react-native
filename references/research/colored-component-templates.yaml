  neutralStroke1:
    rest: alias(neutralStroke1)
  neutralStroke2:
    rest: alias(neutralStroke2)
  neutralStrokeAccessible:
    rest: alias(neutralStrokeAccessible)
  personaActivityGlow:
    rest: legacy(personaActivityGlow)
  personaActivityRing:
    rest: legacy(personaActivityRing)
  personaCoinRingNotRendered: # v0 PersonaCoin: ring.transparent omits the background ring slot
    rest: expr(not rendered (ring.transparent=true))
  personaPresenceAwayBitmap: # v0 PersonaCoin presence icon, a 24x24 indexed PNG
    rest: expr(PNG bitmap) # dominant opaque: #FAC914 (248 px), #FFFFFF (20 px)
  personaPresenceBlockedBitmap: # v0 PersonaCoin presence icon, a 24x24 indexed PNG
    rest: expr(PNG bitmap) # dominant opaque: #FFFFFF (158 px), #E9001B (54 px)
  personaPresenceBusyBitmap: # v0 PersonaCoin presence icon, a 24x24 indexed PNG
    rest: expr(PNG bitmap) # dominant opaque: #E9001B (332 px)
  personaPresenceDoNotDisturbBitmap: # v0 PersonaCoin presence icon, a 24x24 indexed PNG
    rest: expr(PNG bitmap) # dominant opaque: #E9001B (292 px), #FFFFFF (16 px)
  personaPresenceOfflineBitmap: # v0 PersonaCoin presence icon, a 24x24 indexed PNG
    rest: expr(PNG bitmap) # dominant opaque: #FFFFFF (172 px), #A8C4CF (68 px)
  personaPresenceOnlineBitmap: # v0 PersonaCoin presence icon, a 24x24 indexed PNG
    rest: expr(PNG bitmap) # dominant opaque: #6EB005 (293 px), #FFFFFF (15 px)
  presenceBadgeOofColor: # v1 PresenceBadge getBadgeColor nested outOfOffice iconColor; oofColor defaults to the status color
    rest: expr(oofColor ?? nonHcColor)
  strokeBrandLoud:
    rest: flex(color.strokeBrandLoud)
  strokeDangerLoud:
    rest: flex(color.strokeDangerLoud)
  strokeNeutralLoud:
    rest: flex(color.strokeNeutralLoud)
  strokeNeutralSubtle:
    rest: flex(color.strokeNeutralSubtle)
  strokeNeutralTransparent:
    rest: flex(color.strokeNeutralTransparent)
  strokeSuccessLoud:
    rest: flex(color.strokeSuccessLoud)
  strokeWarningLoud:
