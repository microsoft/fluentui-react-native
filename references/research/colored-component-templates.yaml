  personaCoin:
    # v0 PersonaCoin and PersonaCoinRing.
    bg: colorCornflowerPrimary # PersonaCoin.Standard.Bkg
    fg: white # PersonaCoin.Standard.Text
    stroke.glow: personaActivityGlow # PersonaCoin.Standard.GlowStroke
    # Priority picks legacy background over literal white. White is the v0 default iconStrokeColor token;
    # background applies only when that token is falsy.
    stroke.presence: background # PersonaCoin.Standard.PresenceStroke
    stroke.ring: personaActivityRing # PersonaCoin.Standard.RingStroke
    variants:
      accent:
        # Applies when ring.accent is set.
        stroke.glow: accentButtonBackground # PersonaCoin.Accent.GlowStroke
      beige:
        bg: colorBeigePrimary # PersonaCoin.Beige.Bkg
      berry:
        bg: colorBerryPrimary # PersonaCoin.Berry.Bkg
      blue:
        bg: colorBluePrimary # PersonaCoin.Blue.Bkg
      brass:
        bg: colorBrassPrimary # PersonaCoin.Brass.Bkg
      brown:
        bg: colorBrownPrimary # PersonaCoin.Brown.Bkg
      burgundy:
        # coinColor path. coinColorFluent burgundy resolves colorBurgundyPrimary (#a4262c).
        bg: colorDarkRedPrimary # PersonaCoin.Burgundy.Bkg
      coolGray:
        bg: colorPlatinumPrimary # PersonaCoin.CoolGray.Bkg
      cornflower:
        bg: colorCornflowerPrimary # PersonaCoin.Cornflower.Bkg
      cyan:
        bg: colorSteelPrimary # PersonaCoin.Cyan.Bkg
      darkBlue:
        bg: colorRoyalBluePrimary # PersonaCoin.DarkBlue.Bkg
      darkGreen:
        bg: colorDarkGreenPrimary # PersonaCoin.DarkGreen.Bkg
      darkRed:
        # coinColor path. coinColorFluent darkRed resolves colorDarkRedPrimary (#750b1c).
        bg: colorBurgundyPrimary # PersonaCoin.DarkRed.Bkg
      forest:
        bg: colorForestPrimary # PersonaCoin.Forest.Bkg
      gold:
        bg: colorBrassPrimary # PersonaCoin.Gold.Bkg
      grape:
        bg: colorGrapePrimary # PersonaCoin.Grape.Bkg
      green:
        bg: colorForestPrimary # PersonaCoin.Green.Bkg
      highContrast:
        # Same token as the base glow; the stock high-contrast legacy theme sets it to transparent. Applies only when
        # ring.accent is falsy and ring.ringColor is unset.
        stroke.glow: personaActivityGlow # PersonaCoin.Standard.GlowStroke.HighContrast
      hotPink:
        bg: colorHotPinkPrimary # PersonaCoin.HotPink.Bkg
      lightBlue:
        bg: colorCornflowerPrimary # PersonaCoin.LightBlue.Bkg
      lightPink:
        bg: colorBerryPrimary # PersonaCoin.LightPink.Bkg
      lightRed:
        bg: colorRedPrimary # PersonaCoin.LightRed.Bkg
      magenta:
        bg: colorGrapePrimary # PersonaCoin.Magenta.Bkg
      orange:
        bg: colorPumpkinPrimary # PersonaCoin.Orange.Bkg
      orchid:
        bg: colorOrchidPrimary # PersonaCoin.Orchid.Bkg
      pink:
        bg: colorHotPinkPrimary # PersonaCoin.Pink.Bkg
      platinum:
        bg: colorPlatinumPrimary # PersonaCoin.Platinum.Bkg
      pumpkin:
        bg: colorPumpkinPrimary # PersonaCoin.Pumpkin.Bkg
      purple:
        bg: colorPurplePrimary # PersonaCoin.Purple.Bkg
      red:
        bg: colorRedPrimary # PersonaCoin.Red.Bkg
      royalBlue:
        bg: colorRoyalBluePrimary # PersonaCoin.RoyalBlue.Bkg
      rust:
        bg: colorBrownPrimary # PersonaCoin.Rust.Bkg
      steel:
        bg: colorSteelPrimary # PersonaCoin.Steel.Bkg
      teal:
        bg: colorTealPrimary # PersonaCoin.Teal.Bkg
      transparent:
        # Applies when ring.transparent is set; the glow still renders.
        stroke.ring: personaCoinRingNotRendered # PersonaCoin.Transparent.RingStroke
