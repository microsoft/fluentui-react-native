  surfaceNeutralNearer:
    rest: flex(color.surfaceNeutralNearer)
  transparent:
    rest: literal(transparent)
  transparentBackground:
    rest: alias(transparentBackground)
  transparentStroke:
    rest: alias(transparentStroke)
  white:
    rest: literal(white)
templates:
  avatar:
    # bg, fg, and stroke.activity come from the agentic Avatar (Flex); stroke and bg.ring come from the v1 Avatar.
    bg: backgroundNeutralSoft # Avatar.Standard.Bkg
    fg: foregroundNeutralPrimary # Avatar.Standard.Text
    stroke: neutralStroke1 # Avatar.Standard.Stroke
    bg.ring: transparent # Avatar.Standard.BkgRing
    stroke.activity: strokeBrandLoud # Avatar.Standard.ActivityStroke
    variants:
      brand:
        # v1 brand avatarColor.
        bg: brandBackgroundStatic # Avatar.Brand.Bkg
        fg: neutralForegroundOnBrand # Avatar.Brand.Text
        fg.glyph: neutralForegroundOnBrand # Avatar.Brand.Glyph
        stroke.ring: transparentStroke # Avatar.Brand.StrokeRing
      image:
        # Agentic contentMode=image.
        bg: backgroundNeutralTransparent # Avatar.Image.Bkg
      named:
        # v1 named avatarColor. Base values apply to light themes.
        bg: namedColorSetTint40 # Avatar.Named.Bkg.Light
        fg: namedColorSetShade30 # Avatar.Named.Text.Light
        fg.glyph: namedColorSetShade30 # Avatar.Named.Glyph.Light
        stroke.ring: namedColorSetPrimary # Avatar.Named.StrokeRing.Light
        variants:
          dark:
            bg: namedColorSetShade30 # Avatar.Named.Bkg.Dark
            fg: namedColorSetTint40 # Avatar.Named.Text.Dark
            fg.glyph: namedColorSetTint40 # Avatar.Named.Glyph.Dark
            stroke.ring: namedColorSetTint30 # Avatar.Named.StrokeRing.Dark
          highContrast:
            bg: neutralBackground6 # Avatar.Named.Bkg.HighContrast
            fg: neutralForeground3 # Avatar.Named.Text.HighContrast
            fg.glyph: neutralForeground3 # Avatar.Named.Glyph.HighContrast
            stroke.ring: transparentStroke # Avatar.Named.StrokeRing.HighContrast
      neutral:
        # v1 neutral avatarColor. The v1 base tokens author the same values, so this is the v1 default.
        bg: neutralBackground6 # Avatar.Neutral.Bkg
        fg: neutralForeground3 # Avatar.Neutral.Text
        fg.glyph: neutralForeground3 # Avatar.Neutral.Glyph
        stroke.ring: transparentStroke # Avatar.Neutral.StrokeRing
  avatarGroup:
    # No Standard roles. Planned Flex contract (avatar-group tokens).
    variants:
      overflow:
        # Overflow-count indicator.
        bg: surfaceNeutralNearer # AvatarGroup.Overflow.Bkg
        fg: foregroundNeutralPrimary # AvatarGroup.Overflow.Text
        stroke: strokeNeutralSubtle # AvatarGroup.Overflow.Stroke
      stack:
        # Stacked layout.
        bg.cutout: transparent # AvatarGroup.Stack.Cutout
        stroke.cutout: surfaceNeutralNearer # AvatarGroup.Stack.StrokeCutout
  badge:
    # Office seeds. v1 per-color variants are <color><Appearance>, such as dangerFilled; agentic Flex variants are
    # <appearance><Color>, outlineBrand through tintWarning. v1 brand filled has no per-color variant: it is this base
    # plus filled.
    bg: BkgBadge # Badge.Standard.Bkg
    fg: TextBadge # Badge.Standard.Text
    stroke: StrokeBadge # Badge.Standard.Stroke
    variants:
      brandGhost:
        fg: brandForeground1 # Badge.BrandGhost.Text
      brandOutline:
        fg: brandForeground1 # Badge.BrandOutline.Text
      brandTint:
        bg: brandBackground2 # Badge.BrandTint.Bkg
        fg: brandForeground2 # Badge.BrandTint.Text
        stroke: brandStroke2 # Badge.BrandTint.Stroke
      dangerFilled:
        bg: colorRedPrimary # Badge.DangerFilled.Bkg
      dangerGhost:
        fg: colorRedPrimary # Badge.DangerGhost.Text.Light
        variants:
          dark:
            fg: colorRedTint30 # Badge.DangerGhost.Text.Dark
      dangerOutline:
        fg: colorRedPrimary # Badge.DangerOutline.Text.Light
        variants:
          dark:
            fg: colorRedTint30 # Badge.DangerOutline.Text.Dark
      dangerTint:
        bg: colorRedTint60 # Badge.DangerTint.Bkg.Light
        fg: colorRedPrimary # Badge.DangerTint.Text.Light
        stroke: colorRedTint40 # Badge.DangerTint.Stroke.Light
        variants:
          dark:
            bg: colorRedShade40 # Badge.DangerTint.Bkg.Dark
            fg: colorRedTint30 # Badge.DangerTint.Text.Dark
            stroke: colorRedShade30 # Badge.DangerTint.Stroke.Dark
      filled:
        # v1 getFilledColorProps. No light bg, fg, or stroke roles: the per-color *Filled variants supply bg and fg,
        # brand filled keeps the base bg and fg, and the stroke stays the base (v1 crosswalk transparentStroke).
        fg.glyph: badgeFilledColor # Badge.Filled.Glyph.Light
        variants:
          dark:
            bg: badgeColorsBackgroundColorDark # Badge.Filled.Bkg.Dark
            fg: badgeFilledColorsColorDark # Badge.Filled.Text.Dark
            fg.glyph: badgeFilledColorDark # Badge.Filled.Glyph.Dark
          highContrast:
            bg: neutralBackgroundInverted # Badge.Filled.Bkg.HighContrast
            fg: neutralForegroundInverted # Badge.Filled.Text.HighContrast
            stroke: transparentStroke # Badge.Filled.Stroke.HighContrast
            fg.glyph: badgeFilledHcColor # Badge.Filled.Glyph.HighContrast
      ghost:
        # v1 getGhostColorProps. The per-color *Ghost variants supply fg.
        bg: transparentBackground # Badge.Ghost.Bkg
        stroke: transparentStroke # Badge.Ghost.Stroke
        fg.glyph: badgeColorsColor # Badge.Ghost.Glyph.Light
        variants:
          dark:
            fg: badgeColorsColorDark # Badge.Ghost.Text.Dark
            fg.glyph: badgeColorsColorDark # Badge.Ghost.Glyph.Dark
          highContrast:
            fg: neutralForeground3 # Badge.Ghost.Text.HighContrast
            fg.glyph: neutralForeground3 # Badge.Ghost.Glyph.HighContrast
      importantFilled:
        bg: neutralForeground1 # Badge.ImportantFilled.Bkg
        fg: neutralBackground1 # Badge.ImportantFilled.Text
      importantGhost:
        fg: neutralForeground1 # Badge.ImportantGhost.Text
      importantOutline:
        fg: neutralForeground3 # Badge.ImportantOutline.Text
        stroke: neutralStrokeAccessible # Badge.ImportantOutline.Stroke
      importantTint:
        bg: neutralForeground3 # Badge.ImportantTint.Bkg.Light
        fg: neutralBackground1 # Badge.ImportantTint.Text.Light
        stroke: neutralStrokeAccessible # Badge.ImportantTint.Stroke.Light
        variants:
          dark:
            bg: colorGrey68 # Badge.ImportantTint.Bkg.Dark
            fg: colorGrey16 # Badge.ImportantTint.Text.Dark
            stroke: colorGrey68 # Badge.ImportantTint.Stroke.Dark
      informativeFilled:
        bg: neutralBackground5 # Badge.InformativeFilled.Bkg
        fg: neutralForeground3 # Badge.InformativeFilled.Text
        variants:
          highContrast:
            bg: neutralBackground3 # Badge.InformativeFilled.Bkg.HighContrast
            fg: brandForeground1 # Badge.InformativeFilled.Text.HighContrast
      informativeGhost:
        fg: neutralForeground3 # Badge.InformativeGhost.Text
      informativeOutline:
        fg: neutralForeground3 # Badge.InformativeOutline.Text
        stroke: neutralStroke2 # Badge.InformativeOutline.Stroke
      informativeTint:
        bg: neutralBackground4 # Badge.InformativeTint.Bkg
        fg: neutralForeground3 # Badge.InformativeTint.Text
        stroke: neutralStroke2 # Badge.InformativeTint.Stroke
      outline:
        # v1 getOutlineColorProps. The per-color *Outline variants supply fg, and stroke where authored.
        bg: transparentBackground # Badge.Outline.Bkg
        stroke: badgeColorsBorderColor # Badge.Outline.Stroke.Light
        fg.glyph: badgeColorsColor # Badge.Outline.Glyph.Light
        variants:
          dark:
            fg: badgeColorsColorDark # Badge.Outline.Text.Dark
            stroke: badgeOutlineColorsBorderColorDark # Badge.Outline.Stroke.Dark
            fg.glyph: badgeOutlineColorDark # Badge.Outline.Glyph.Dark
          highContrast:
            fg: neutralForeground3 # Badge.Outline.Text.HighContrast
