        bg: colorOrchidPrimary # PersonaCoin.Violet.Bkg
      warmGray:
        bg: colorBeigePrimary # PersonaCoin.WarmGray.Bkg
  personaPresence:
    # No Standard roles. v0 PersonaCoin presence bitmaps; v0 reuses them when out of office.
    variants:
      away:
        fg.glyph: personaPresenceAwayBitmap # PersonaPresence.Away.Bitmap
      blocked:
        fg.glyph: personaPresenceBlockedBitmap # PersonaPresence.Blocked.Bitmap
      busy:
        fg.glyph: personaPresenceBusyBitmap # PersonaPresence.Busy.Bitmap
      doNotDisturb:
        fg.glyph: personaPresenceDoNotDisturbBitmap # PersonaPresence.DoNotDisturb.Bitmap
      offline:
        fg.glyph: personaPresenceOfflineBitmap # PersonaPresence.Offline.Bitmap
      online:
        fg.glyph: personaPresenceOnlineBitmap # PersonaPresence.Online.Bitmap
  presenceBadge:
    # No light glyph role at this level: the status variants set fg.glyph, and the v1 base tokens default to the
    # available color.
    bg: neutralBackground1 # PresenceBadge.Standard.Bkg
    stroke: colorWhite # PresenceBadge.Standard.Stroke
    variants:
      available:
        # The v1 base tokens default to this color.
        fg.glyph: colorLightGreenPrimary # PresenceBadge.Available.Glyph
      away:
        fg.glyph: colorMarigoldPrimary # PresenceBadge.Away.Glyph
        variants:
          outOfOffice:
            fg.glyph: colorBerryPrimary # PresenceBadge.Away.Glyph.OutOfOffice
      blocked:
        fg.glyph: colorRedPrimary # PresenceBadge.Blocked.Glyph
      busy:
        fg.glyph: colorRedPrimary # PresenceBadge.Busy.Glyph
      doNotDisturb:
        fg.glyph: colorRedPrimary # PresenceBadge.DoNotDisturb.Glyph
      highContrast:
        stroke: transparent # PresenceBadge.Standard.Stroke.HighContrast
        fg.glyph: neutralForeground3 # PresenceBadge.Standard.Glyph.HighContrast
      offline:
        fg.glyph: colorGrey38 # PresenceBadge.Offline.Glyph
        variants:
          highContrast:
            fg.glyph: neutralForeground3 # PresenceBadge.Offline.Glyph.HighContrast
      outOfOffice:
        # outOfOffice prop modifier: the active status oofColor, else the status color (see the header for offline).
        fg.glyph: presenceBadgeOofColor # PresenceBadge.Standard.Glyph.OutOfOffice
        variants:
          highContrast:
            fg.glyph: neutralForeground3 # PresenceBadge.Standard.Glyph.OutOfOfficeHighContrast
      outOfOfficeStatus:
        # The outOfOffice status, renamed to avoid the outOfOffice prop modifier.
        fg.glyph: colorBerryPrimary # PresenceBadge.OutOfOffice.Glyph
      unknown:
        fg.glyph: colorRedPrimary # PresenceBadge.Unknown.Glyph
