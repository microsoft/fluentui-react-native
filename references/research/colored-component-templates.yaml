# Colored component control templates
#
# Maps every role in colored-component-slots.yaml into the ControlColorMap schema in ctlTemplates.ts. colors holds
# InteractiveColor entries, and templates holds one ControlTemplate per component, with bg, fg, stroke, dotted bg.*,
# fg.*, and stroke.* roles, and nested variants. The roles are static, so every color defines only rest. Office
# palette fields are mapped in office-templates.yaml; the Office badge seeds keep the same color names there and here
# (BkgBadge, StrokeBadge, TextBadge).
#
# Source: colored-component-slots.yaml (schema_version 4), whose source is colors\Office.palette, revision
# 6963a5424731338e25c68cc28627bcc3428f0131, selector Root/PaletteType[@Name=""], app Mso. Source locations,
# used_by conditions, and other evidence live in colored-component-slots.yaml and semantic-slot-sources.yaml.
#
# Coverage: each of the 241 source field keys (Avatar, AvatarGroup, Badge, PersonaCoin, PersonaPresence, and
# PresenceBadge) appears exactly once, as the trailing comment of the template slot it maps to. No other comment uses
# that key form.
#
# Values name their source namespace:
# - office(X): an Office SwatchSet field.
# - alias(X): a fluent2 alias token (theme.colors.X in v1 components).
# - flex(color.X): an X3 Flex token, with its full path.
# - legacy(X): a FURN legacy theme color (theme.colors.X in v0 components).
# - literal(X): a raw color literal.
# - expr(X): the source value_expression, verbatim: a fluent2 global palette symbol such as colorRedPrimary, or a
#   computed or caller expression. Hex annotations move to comments. expr(PNG bitmap) abbreviates a v0 presence PNG
#   palette. Its comment lists the dominant opaque colors with opaque pixel counts, decoded from the 24x24 data URIs
#   in packages/components/PersonaCoin/src/PersonaCoin.helpers.ts; antialias tints are omitted.
#
# Colors
# - A color is named after the token its roles resolve to: the Office field, alias name, Flex name without color.,
#   legacy name, global palette symbol, or literal. Roles that resolve to the same token share a color, so Light,
#   Dark, and HighContrast forms are separate colors only when their tokens differ. No names collide across
#   namespaces.
# - Computed expressions have descriptive names, and each color comment names its source:
#   - namedColorSet<Step>: v1 Avatar getNamedColorSet(avatarColor).<step>.
#   - badgeColors<Input>: a v1 Badge helper expression over the per-color inputs only, named by its first operand.
#   - badge<Appearance><Local>: an assignment to a helper local (color, colorDark, hcColor) in getFilledColorProps or
#     getOutlineColorProps.
#   - badge<Appearance>Colors<Input>: an expression whose fallback reads helper locals.
#   - presenceBadgeOofColor, personaCoinRingNotRendered, and personaPresence<Status>Bitmap.
#
# Slots: Bkg -> bg, Text -> fg, Glyph -> fg.glyph, Stroke -> stroke, StrokeRing and RingStroke -> stroke.ring,
# BkgRing -> bg.ring, ActivityStroke -> stroke.activity, GlowStroke -> stroke.glow, PresenceStroke -> stroke.presence,
# Cutout -> bg.cutout, StrokeCutout -> stroke.cutout, and Bitmap -> fg.glyph (a whole bitmap rather than a tint).
# Agentic badges color their icons with fg. v1 per-color Text roles feed fg and, through the appearance expressions,
# fg.glyph.
#
# Variants
# - The Standard appearance is the base template. Other appearances are camelCase variants. A variant overrides only
#   the roles it names and inherits the rest.
# - Light and unsuffixed roles are base values of their template or variant. Dark roles go in a nested dark variant
#   (v1 DarkGray and Black themes) and HighContrast roles in a nested highContrast variant, at the level where the
#   source defines them. OutOfOffice becomes a nested outOfOffice variant, with highContrast nested inside it for
#   OutOfOfficeHighContrast.
# - Composition order, first to last:
#   - avatar: base; one of brand, named, or neutral (v1 avatarColor; neutral repeats the v1 base tokens, so it is the
#     v1 default) or image (agentic contentMode=image); then named.variants.dark or named.variants.highContrast.
#   - avatarGroup: no base roles. Apply overflow to the overflow-count item and stack to the stacked layout.
#   - badge, v1 (color-first): base; appearance (filled, ghost, outline, or tint); <color><Appearance>; then
#     <appearance>.variants.<mode>; then <color><Appearance>.variants.<mode>. The mode layers must follow the
#     per-color layer; for example, high-contrast dangerFilled falls back to the filled highContrast fill.
#     Expressions over colors.<input> read the active per-color variant: color, backgroundColor, and borderColor are
#     its fg, bg, and stroke; colorDark, backgroundColorDark, and borderColorDark are its dark values; hcColor is its
#     highContrast fg.
#   - badge, agentic Flex (appearance-first): base, then one <appearance><Color> variant (outlineBrand through
#     tintWarning). Flex tokens resolve per theme, so there are no mode variants. Do not combine them with v1
#     variants.
#   - personaCoin (v0): base; coin color; highContrast; then the ring options accent (ring.accent) and transparent
#     (ring.transparent). accent follows highContrast because the high-contrast glow applies only without
#     ring.accent.
#   - personaPresence (v0): no base roles. Apply one presence variant.
#   - presenceBadge (v1): base; status (available, away, blocked, busy, doNotDisturb, offline, outOfOfficeStatus, or
#     unknown); with the outOfOffice prop, outOfOffice and then <status>.variants.outOfOffice; in high contrast,
#     highContrast, then <status>.variants.highContrast, then outOfOffice.variants.highContrast.
#
# Multiple sources: when a role has more than one token namespace, its value follows the priority office, flex,
# alias, legacy, literal, then expr, and the alternatives are noted.
# - The three Badge Standard roles use their Office seeds. The v1 alias crosswalks are noted on BkgBadge, StrokeBadge,
#   and TextBadge.
# - The PersonaCoin Standard PresenceStroke role uses legacy background over literal white. Both come from the v0
#   PersonaCoin: white is the default iconStrokeColor token, and background is the fallback when that token is
#   falsy.
# - The Burgundy and DarkRed coin colors use the top-level source value (the coinColor path); coinColorFluent swaps
#   the two. Their slots note the alternative.
#
# Deviations
# - presenceBadge: the OutOfOffice status appearance is outOfOfficeStatus, because the Standard OutOfOffice suffix
#   already takes outOfOffice for the outOfOffice prop modifier, which also nests under away. In v1 the status and the
#   prop share one outOfOffice token layer.
# - avatarGroup and personaPresence have no Standard roles, so their base templates are empty.
#
# Unresolved
# - PersonaCoin PresenceStroke: priority picks legacy background, but the shipped default token is literal white.
# - personaCoin highContrast reuses personaActivityGlow. The stock high-contrast legacy theme sets that token to
#   transparent; there is no distinct high-contrast token.
# - presenceBadge offline with the outOfOffice prop: v1 offline nests no outOfOffice override, so the shared layer
#   shows the OutOfOffice status color (colorBerryPrimary). Here outOfOffice resolves oofColor ?? nonHcColor, which
#   offline does not define.
# - badgeFilledColorDark equals badgeFilledColorsColorDark, and badgeOutlineColorDark equals badgeColorsColorDark,
#   because the icon copies the resolved foreground. They stay separate because the source records different
#   expressions.
# - avatar stroke.ring (v1 activity ring) and stroke.activity (agentic activity ring) describe the same ring in two
#   generations.
colors:
  BkgBadge: # Office seed. v1 alias crosswalk: brandBackgroundStatic (v1 base and brand filled fill)
    rest: office(BkgBadge)
  StrokeBadge: # Office seed. v1 alias crosswalk: transparentStroke (v1 base and filled border)
    rest: office(StrokeBadge)
  TextBadge: # Office seed. v1 alias crosswalk: neutralForegroundOnBrand (v1 base text, filled color fallback)
    rest: office(TextBadge)
  accentButtonBackground:
    rest: legacy(accentButtonBackground)
  background:
    rest: legacy(background)
  backgroundBrandSoft:
    rest: flex(color.backgroundBrandSoft)
  backgroundDangerSoft:
    rest: flex(color.backgroundDangerSoft)
  backgroundNeutralSoft:
    rest: flex(color.backgroundNeutralSoft)
  backgroundNeutralTransparent:
    rest: flex(color.backgroundNeutralTransparent)
  backgroundSuccessSoft:
    rest: flex(color.backgroundSuccessSoft)
  backgroundWarningSoft:
    rest: flex(color.backgroundWarningSoft)
  badgeColorsBackgroundColorDark: # v1 Badge getFilledColorProps and getTintColorProps dark backgroundColor
    rest: 'expr(colors.backgroundColorDark || colors.backgroundColor)'
  badgeColorsBorderColor: # v1 Badge getOutlineColorProps light borderColor
    rest: 'expr(colors.borderColor || colors.color)'
  badgeColorsBorderColorDark: # v1 Badge getTintColorProps dark borderColor
    rest: 'expr(colors.borderColorDark || colors.borderColor)'
  badgeColorsColor: # v1 Badge ghost, outline, and tint light iconColor, copying the color input
    rest: expr(colors.color)
  badgeColorsColorDark: # v1 Badge ghost, outline, and tint dark color; ghost and tint dark iconColor
    rest: 'expr(colors.colorDark || colors.color)'
  badgeFilledColor: # v1 Badge getFilledColorProps local color; light iconColor
    rest: 'expr(color = colors.color || theme.colors.neutralForegroundOnBrand)'
  badgeFilledColorDark: # v1 Badge getFilledColorProps local colorDark; dark iconColor, equal to badgeFilledColorsColorDark
    rest: 'expr(colorDark = colors.colorDark || color)'
  badgeFilledColorsColorDark: # v1 Badge getFilledColorProps dark color; color is the resolved local light color
    rest: 'expr(colors.colorDark || color)'
  badgeFilledHcColor: # v1 Badge getFilledColorProps local hcColor; high-contrast iconColor
    rest: 'expr(hcColor = colors.hcColor || theme.colors.neutralForegroundInverted)'
  badgeOutlineColorDark: # v1 Badge getOutlineColorProps local colorDark; dark iconColor, equal to badgeColorsColorDark
    rest: 'expr(colorDark = colors.colorDark || colors.color)'
  badgeOutlineColorsBorderColorDark: # v1 Badge getOutlineColorProps dark borderColor; borderColor and colorDark are locals
    rest: 'expr(colors.borderColorDark || borderColor || colorDark)'
  brandBackground2:
    rest: alias(brandBackground2)
  brandBackgroundStatic:
    rest: alias(brandBackgroundStatic)
  brandForeground1:
    rest: alias(brandForeground1)
  brandForeground2:
    rest: alias(brandForeground2)
  brandStroke2:
    rest: alias(brandStroke2)
  colorBeigePrimary:
    rest: expr(colorBeigePrimary) # #7a7574
  colorBerryPrimary:
    rest: expr(colorBerryPrimary) # #c239b3
  colorBluePrimary:
    rest: expr(colorBluePrimary) # #0078d4
  colorBrassPrimary:
    rest: expr(colorBrassPrimary) # #986f0b
  colorBrownPrimary:
    rest: expr(colorBrownPrimary) # #8e562e
  colorBurgundyPrimary:
    rest: expr(colorBurgundyPrimary) # #a4262c
  colorCornflowerPrimary:
    rest: expr(colorCornflowerPrimary) # #4f6bed
  colorDarkGreenPrimary:
    rest: expr(colorDarkGreenPrimary) # #0b6a0b
  colorDarkOrangePrimary:
    rest: expr(colorDarkOrangePrimary)
  colorDarkOrangeTint30:
    rest: expr(colorDarkOrangeTint30)
  colorDarkOrangeTint60:
    rest: expr(colorDarkOrangeTint60)
  colorDarkRedPrimary:
    rest: expr(colorDarkRedPrimary) # #750b1c
  colorForestPrimary:
    rest: expr(colorForestPrimary) # #498205
  colorGrapePrimary:
    rest: expr(colorGrapePrimary) # #881798
  colorGreenPrimary:
    rest: expr(colorGreenPrimary)
  colorGreenShade30:
    rest: expr(colorGreenShade30)
  colorGreenShade40:
