scope: Standard theme-driven Win32 component patterns and non-deprecated Office roles. Expressive Avatar,
  AvatarGroup, Badge, PresenceBadge, Persona, and PersonaCoin mappings are maintained separately in
  colored-component-slots.yaml.
source:
  definition: colors\Office.palette
  revision: 6963a5424731338e25c68cc28627bcc3428f0131
  selector: Root/PaletteType[@Name=""]
  deprecation_semantics: palettecompiler\UIPaletteShared\PaletteParser.cs
usage_basis: composite_source_inventory
source_references: semantic-slot-sources.yaml
related_mappings:
  colored_components: colored-component-slots.yaml
guidance:
  - Resolve these fields through the palette for the containing UI region. Their roles are semantic; their
    actual colors vary with the palette, theme, application, and high-contrast mode.
  - Transparent controls expose the region's Bkg at rest. When their background changes for hover, press, or
    selection, use the matching foreground state.
  - Ctl colors are for standard push buttons, CtlEmphasis colors are for emphasis-styled push buttons, and
    CtlSubtle colors are for checkboxes and radio buttons. Text-entry controls use the TextBox family.
  - Selected denotes a control's selected state. SelectionHighlight denotes selected text; these are not
    interchangeable.
  - Deprecated Office SwatchSet entries remain excluded; consult swatch-set-usage.yaml for historical usage
    and replacements. Deprecated Theme references from component sources are retained only as tokens.legacy
    bindings.
  - Original Office roles retain the palette definition's descriptions and control-group guidance.
    Component-only roles describe the observed or planned component source without redefining the original
    Office usage.
  - literal contains raw color or SVG paint literals; platform contains platform color references such as
    PlatformColor(...). Symbolic globals, computed expressions, inherited currentColor, and unresolved caller
    values remain in value_expression rather than being mislabeled as literal colors.
  - used_by.component follows <generation>.<component>-<setting>. Match its complete <generation>.<component>
    prefix against semantic-slot-sources.yaml, then look up the exact setting. Component and generation names
    can contain hyphens, so do not split at the first hyphen.
  - Source locations, mapping provenance, declaration annotations, conditional context, colorless coverage,
    and opacity modifiers live in semantic-slot-sources.yaml. Each setting reference retains its slot and
    token payload so identical component-setting labels can still be traced to their exact declarations.
  - potential_matches resolves against the union of fields in semantic-slots.yaml and
    colored-component-slots.yaml. The two collections have disjoint keys; cross-collection matches are not
    dangling local references.
  - Primary and Emphasis push buttons share Ctl.Emphasis. Filled default buttons called Secondary or Subtle
    share Ctl.Standard; Ctl.Subtle remains the Office checkbox/radio family. Transparent treatments remain
    distinct.
  - Keys follow <control>.<appearance>.<usage>[.<state>] and remain sorted. The original Office palette seeds
    live under tokens.office; Office aliases remain definition metadata.
  - tokens has office, alias, flex, legacy, literal, and platform namespaces. Component usages contain only
    the value source authored by the component. Agentic and pinned Flex declarations retain their Flex token,
    not automatically derived aliases or legacy crosswalks.
  - Top-level alias, flex, legacy, literal, platform, and value_expression values require a matching authored
    used_by value and exact source-index evidence. The initial Office palette seeds are the only exception;
    component-only roles do not acquire an inferred Office token.
  - conflicts is recomputed from disagreements between distinct component source identities within an authored
    namespace. Removed crosswalks, inferred Office correlations, and stock-theme-resolved literals are not
    component conflicts. Intentional conditional variants remain separate evidence.
  - Source annotations identify unused declarations, overridden fallbacks, planned Flex contracts, native or
    caller ownership, and optional host projection context. Such context does not add another authored
    component token source.
control_families:
  surface: UI regions and containers using the palette
  static_foreground: Non-interactive text and foreground content
  transparent_control: Ribbon buttons, list items, and other transparent-at-rest controls
  striped_control: Pseudo-disabled controls with diagonal stripes and a dashed border
  standard_push_button: Standard push buttons such as core:Button OK and Cancel buttons
  emphasis_push_button: Push buttons using an emphasis button style
  checkbox_radio: Checkboxes and radio buttons, not generic subtle push buttons
  text_entry: Text boxes and editable combo boxes
  hyperlink: Hyperlinks on resting, hovered, or selected parent surfaces
  active_text: Text-only interactive controls such as pivot controls
  stroke_only_control: Controls such as color-picker swatches that change only their border
  error_foreground: Error text and error foreground content
  toggle_switch: Toggle-switch thumb, track background, and outline
  slider: Slider rendering, buffered regions, focus, and slider tooltips
  scrollbar: Scrollbar gutter, scroll-button glyphs, and hover frame
  accent_border: Region borders, separators, and accent rectangles
  group_header: Group headers such as gallery group headings
  decorative_foreground: Color roles authored for breadcrumb and related controls.
  unstyled_primitive: Color roles authored for CheckboxIndicator and related controls.
  selection_affordance: Color roles authored for combobox and related controls.
  overlay: Color roles authored for dialog and related controls.
  elevation: Color roles authored for dialog and related controls.
  drawer_handle: Color roles authored for Drawer and related controls.
  overlay_scrim: Color roles authored for Drawer and related controls.
  selection_trigger: Color roles authored for dropdown and related controls.
  status_foreground: Color roles authored for field and related controls.
  focus_visual: Color roles authored for FocusRing and related controls.
  icon: Color roles authored for Icon and related controls.
  interactive_tag: Color roles authored for interaction-tag and related controls.
  form_label: Color roles authored for label and related controls.
  collection: Color roles authored for list and related controls.
  push_button_foreground: Color roles authored for MenuButton and related controls.
  menu_choice: Color roles authored for MenuItemCheckbox and related controls.
  notification_banner: Color roles authored for message-bar and related controls.
  navigation_row: Color roles authored for nav-item and related controls.
  notification: Color roles authored for Notification and related controls.
  progress_indicator: Color roles authored for ProgressBar and related controls.
  radio_group: Color roles authored for RadioGroup and related controls.
  shadow: Color roles authored for Shadow and related controls.
  loading_placeholder: Color roles authored for Shimmer and related controls.
  outline_push_button: Color roles authored for split-button and related controls.
  tab: Color roles authored for Tab and related controls.
  agentic_tag: Color roles authored for Tag and related controls.
  toggle_button: Color roles authored for toggle-button and related controls.
