# Swatch color layers derived from the Flex web component specifications; schema: swatchLayers.ts.
# Source: flex-components 1.5.0, marketplace commit 206c4996, plugin tree b08bdc0d, pinned in
# packages/agentic/components/spec-source-lock.json. Mobile specs and existing FURN mappings are excluded.
#
# Conventions:
# - layers contains bg.*, fg.*, and stroke.* names. The prefix follows the token category, not its use:
#   a progress-bar fill can reference fg.brandPrimary, and a switch stroke can reference fg.neutralSecondary.
# - OKLCH(token) records computed hover/pressed colors. type is standard or inverted according to the
#   Flex interaction formula; it is omitted when indeterminate. Hover and pressed remain within ColorLayer.
# - Other keys are slot colors: icon, placeholder, required, secondary, shimmer, track, and underlay.
#   Only consumed slots apply; extra non-conflicting colors do not introduce new component slots or states.
# - Disabled presentations use dedicated, static ColorLayers, including unchanged transparent colors.
#   Disabled slot colors are explicit; disabled layers have no hover, pressed, type, or enabled-slot colors.
#   Compatible disabled layers are shared with each other, never merged into enabled layers.
#   Thus read-only and disabled strokes remain separate layers even when their rest tokens match.
# - presentations deduplicates exact bg/fg/stroke combinations. Names use the bg layer first, then fg,
#   then stroke, without the category prefix; numeric suffixes distinguish conflicting combinations.
# - components maps component[.part][.variant] to base and alternate state presentations. YAML aliases
#   resolve to ComponentPresentation objects, not strings. Every state is a complete presentation.
#   checkedDisabled, indeterminateDisabled, and selectedDisabled preserve independent status axes.
#   Disabled replaces mutually exclusive error/readOnly/visited states; those use the component's disabled.
#   Focused colors use alternate presentations; focus-ring geometry is outside this color reference.
# - Empty base presentations mean no painted part at rest (validation messages and nav indicators).
#   Loading belongs to the menu/listbox Section Header variant, not the interactive item variant.
# - Layer merges allow extra non-conflicting keys. Numbered names distinguish conflicting layers.
#   All mapping keys are alphabetical; the three top-level sections follow the TypeScript schema order.
#
# Delegated colors: breadcrumb items, menu buttons, split buttons, unselected toggle buttons, and
# InfoLabel triggers use Button; combo/dropdown/select/search fields use Input; Menu and TeachingPopover
# containers use Popover; InfoLabel text and RadioGroup legends use Label.

layers:
