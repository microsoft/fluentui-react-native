    hover: OKLCH(--gnrc-color-background-brand-heavy)
    pressed: OKLCH(--gnrc-color-background-brand-heavy)
    rest: --gnrc-color-background-brand-heavy
    type: inverted
  bg.brandSoft:
    rest: --gnrc-color-background-brand-soft
  bg.dangerLoud:
    hover: OKLCH(--gnrc-color-background-danger-loud)
    pressed: OKLCH(--gnrc-color-background-danger-loud)
