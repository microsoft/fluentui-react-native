schemaVersion: 1
description: Authoring-source mappings used to populate the grouped React Native Flex
  token contract.
target:
  types:
    supported: FlexTokens
    unsupported: UnsupportedFlexTokens
  definition: '../flex.types.ts'
  direction: flex token path <- authoring source token
sources:
  generic:
    description: Generic Flex CSS custom properties.
    locations:
      - dev/web/flex-themes/css/semantic.css
      - dev/web/flex-themes/css/interaction-fallback.css
  fluent:
    description: Fluent UI React Native / Fluent 2 tokens used for native defaults.
    package: '@fluentui-react-native/design-tokens-win32/colorful'
    prefixes:
      alias.: Stateful semantic alias token — colorful/tokens-aliases.json.
      global.: Raw global token — colorful/tokens-global.json.
      shadow.: Elevation shadow token — colorful/tokens-shadow.json.
  furn-theme:
    description: Dot path to the corresponding value in the Fluent UI React Native
      Theme type.
    definition: '../../theming/types/Theme.types.ts'
rules:
  colorStates:
    shape: Each color has a required rest mapping and optional hover and pressed mappings.
    projection:
      rest: color.<name>
      hover: color.hover.<name>
      pressed: color.pressed.<name>
    fluentAliases: Alias references identify explicit state leaves such as alias.brandBackground.rest,
      alias.brandBackground.hover, and alias.brandBackground.pressed.
  matching:
    spacing / radius / stroke / fontSize: nearest value in the corresponding Fluent
      scale (size / corner / stroke / font.size).
    lineHeight: flex line-height is relative (%); resolved to the nearest Fluent absolute
      font.lineHeight using fontSize x percent.
    fontWeight: role match (regular/medium/semibold/bold) — flex Segoe weights (420/550/600/625)
      differ in value from Fluent (400/500/600/700).
    fontFamily: role match (base / monospace).
  notes:
    - global.* references are best-fit matches into the Fluent global palette; expression
      families map to the matching shared-color ramp step, gray to the grey ramp, alpha/translucent
      roles to the *Alpha ramps.
    - color.materialBackground* map to whiteAlpha fallbacks — platform acrylic/vibrancy
      material (WinUI AcrylicBrush / NSVisualEffectView) is preferred where available.
    - Non-color coverage here is limited to elevation shadow tokens; spacing/radius/typography/font-weight
      would source from Fluent global size/corner/font/stroke tokens.
    - null = no equivalent Fluent global token; fall back to the flex source value in
      semantic.css.
    - letterSpacing* are null — Fluent global has no letter-spacing/tracking token.
    - fontFamily.contentEditorial is null — Fluent global has no serif family token.
    - furn-theme is omitted when Theme has no corresponding value path.
    - Button uses borderRadius.base200 / base300 / base400 for small / medium / large.
      The FURN Theme exposes its shared small/medium Button radius, but its large
      size-specific radius remains sourced from Fluent global tokens.
    - Flex has finer/larger steps than Fluent in a few scales (e.g. radius 16/24/28,
      spacing 96); nearest emits the closest Fluent token — prefer the flex default
      where an exact step matters.
