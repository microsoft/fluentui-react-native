schemaVersion: 1
component: switch
implementation: switch.styles.ts

statePrecedence:
  - base
  - checked
  - disabled
  - pressed
  - hovered

notes:
  colorLevels: getThemedColorStyleFactory is configured with a checked level followed by the shared interactiveStatePriority level, so checked selects the color family and disabled, pressed, and hovered refine it.
  animatedColors: Track and thumb colors are supplied as an interpolation between the unchecked and checked resolutions of the same definition rather than as a single resolved value.

bindings:
  layoutContainer:
    static:
      alignSelf: flex-start
    layout:
      switch:
        flexDirection: column
        gap: 0
        padding: 0
      horizontal:
        alignItems: center
        flexDirection: row
        gap: size40
        padding: size80
      vertical:
        alignItems: flex-start
        flexDirection: column
        gap: size40
        padding: size80

  root:
    static:
      alignItems: center
      alignSelf: flex-start
      backgroundColor: transparent
      justifyContent: center
      minHeight: size360
      minWidth: size560
      paddingHorizontal: size80
      paddingVertical: size80
    themed:
      borderRadius: borderRadius.circular
    userStyle: applied last by useSwitchStyles_unstable

  focusVisual:
    borderRadius: resolved root borderRadius
    innerColor: color.strokeFocusInner
    innerWidth: strokeWidth.thin
    outerColor: color.strokeFocusOuter
    outerWidth: strokeWidth.thick
    visible: focused and not disabled

  track:
    static:
      alignItems: center
      height: size200
      justifyContent: center
      position: relative
      width: size400
    themed:
      borderRadius: borderRadius.circular
      borderWidth: strokeWidth.thin
    color:
      base:
        backgroundColor: color.backgroundNeutralTransparent
        borderColor: color.foregroundNeutralSecondary
      disabled:
        backgroundColor: color.backgroundNeutralTransparent
        borderColor: color.strokeNeutralDisabled
      checked:
        backgroundColor: color.backgroundNeutralHeavy
        borderColor: color.strokeNeutralHeavy
      checkedDisabled:
        backgroundColor: color.backgroundNeutralHeavyDisabled
        borderColor: color.strokeNeutralDisabled

  thumb:
    static:
      height: 14
      width: 14
      position: absolute
      left: size20
      top: size20
    themed:
      borderRadius: borderRadius.circular
    color:
      base:
        backgroundColor: color.foregroundNeutralSecondary
      disabled:
        backgroundColor: color.foregroundNeutralDisabled
      checked:
        backgroundColor: color.foregroundNeutralOnloud
      checkedDisabled:
        backgroundColor: color.foregroundNeutralDisabled
    translateX:
      implementation: getSwitchThumbTranslateDistance
      formula: size400 minus twice strokeWidth.thin minus twice size20 minus the thumb width

  label:
    slots:
      - beforeLabel
      - afterLabel
      - aboveLabel
    static:
      flexShrink: 1
      minWidth: 0
    themed:
      color: color.foregroundNeutralPrimary
      fontFamily: fontFamily.functional
      fontSize: fontSize.functionalBodyMedium
      fontWeight: fontWeight.functionalRegular
      lineHeight: lineHeight.functionalBodyMedium
    disabled:
      color: color.foregroundNeutralDisabled

motion:
  implementation: useSwitch.ts
  driver: Animated.timing with useNativeDriver false
  duration: 150
  easing: Easing.inOut(Easing.ease)
  skipped: first mount, and whenever the platform reduced-motion setting is on

tokenGaps:
  - id: switch-thumb-size
    binding: thumb.height and thumb.width
    value: 14
    reason: The thumb diameter is derived from the track height minus the border and inset and has no token on the sizing scale.
  - id: switch-motion-duration
    binding: motion.duration
    value: 150
    reason: This package publishes no motion tokens, so the transition duration is a literal.
  - id: switch-global-size-tokens
    binding: layoutContainer.gap, layoutContainer.padding, root.minHeight, root.minWidth, root.padding, track.height, track.width, thumb.left, thumb.top
    value: size20, size40, size80, size200, size360, size400, size560
    reason: These come from the global size scale rather than from a themed spacing or sizing token, so they do not respond to theme state.
