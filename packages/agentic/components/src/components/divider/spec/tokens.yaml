schemaVersion: 1
component: divider
implementation: divider.styles.ts

# Divider has no interaction state, so every binding below resolves from the
# orientation axis and the layout axis only.
statePrecedence:
  - vertical
  - layout

bindings:
  root:
    layout:
      alignItems: center
      alignSelf: stretch
      justifyContent: center
    orientation:
      horizontal:
        flexDirection: row
      vertical:
        flexDirection: column

  line:
    implementation: divider.styles.ts getDividerLineStyle
    color:
      backgroundColor: color.strokeNeutralSubtle
    orientation:
      horizontal:
        height: strokeWidth.thin
      vertical:
        width: strokeWidth.thin
    layout:
      grow:
        flexBasis: 0
        flexGrow: 1
      stub:
        flexBasis: spacing.componentBase100
        flexGrow: 0
    stubSelection:
      center: none
      start: leading line
      end: trailing line

  contentContainer:
    layout:
      alignItems: center
      flexDirection: row
      flexShrink: 1
      justifyContent: center
      gap: spacing.componentBase150
    orientation:
      horizontal:
        paddingHorizontal: spacing.componentBase300
      vertical:
        paddingVertical: spacing.componentBase300

  icon:
    implementation: useDividerStyles.ts
    color: color.foregroundNeutralSecondary
    height: 20
    width: 20

  label:
    layout:
      flexShrink: 1
      textAlign: center
    typography:
      fontFamily: fontFamily.functional
      fontSize: fontSize.functionalBodySmall
      fontWeight: fontWeight.functionalRegular
      lineHeight: lineHeight.functionalBodySmall
    color: color.foregroundNeutralSecondary

tokenGaps:
  - binding: icon.height, icon.width
    detail: The 20 by 20 icon box is a literal in useDividerStyles.ts and is not bound to a global size constant or component token.
  - binding: label.typography, icon.color
    detail: The horizontal and vertical orientation branches resolve identical typography and color values, so the orientation axis carries no color or type distinction.
