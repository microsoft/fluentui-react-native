schemaVersion: 1
component: button
implementation: button.styles.ts

statePrecedence:
  - appearance
  - selected
  - disabled
  - pressed
  - hovered

bindings:
  root:
    layout:
      alignItems: center
      alignSelf: flex-start
      borderStyle: solid
      flexDirection: row
      justifyContent: center
      borderWidth: strokeWidth.thin
      minHeight: size240
      minWidth: size240
    appearance:
      primary:
        backgroundColor: color.backgroundBrandHeavy
        borderColor: color.strokeNeutralTransparent
        foreground: color.foregroundBrandOnloud
      secondary:
        backgroundColor: color.backgroundNeutralSubtle
        borderColor: color.strokeNeutralTransparent
        foreground: color.foregroundNeutralPrimary
      outline:
        backgroundColor: color.backgroundNeutralTransparent
        borderColor: color.strokeNeutralLoud
        foreground: color.foregroundNeutralPrimary
      subtle:
        backgroundColor: color.backgroundNeutralTransparent
        borderColor: color.strokeNeutralTransparent
        foreground: color.foregroundNeutralPrimary
    selected:
      primary:
        backgroundColor: color.backgroundBrandHeavy
        foreground: color.foregroundBrandOnloud
      secondary:
        backgroundColor: color.backgroundNeutralHeavy
        foreground: color.foregroundNeutralOnloud
      outline:
        backgroundColor: color.backgroundNeutralHeavy
        borderColor: color.strokeNeutralHeavy
        foreground: color.foregroundNeutralOnloud
      subtle:
        backgroundColor: color.backgroundNeutralSoft
        foreground: color.foregroundNeutralPrimary
    disabled:
      foreground: color.foregroundNeutralDisabled
      primary:
        backgroundColor: color.backgroundNeutralHeavyDisabled
      secondary:
        backgroundColor: color.backgroundNeutralSubtleDisabled
      outline:
        borderColor: color.strokeNeutralDisabled
      selectedSecondary:
        backgroundColor: color.backgroundNeutralHeavyDisabled
      selectedOutline:
        backgroundColor: color.backgroundNeutralHeavyDisabled
        borderColor: color.strokeNeutralDisabled
      selectedSubtle:
        backgroundColor: color.backgroundNeutralSubtleDisabled
    interaction:
      hovered: color.hover
      pressed: color.pressed
      subtleHoveredBackground: color.hover.backgroundNeutralSubtle
      subtlePressedBackground: color.pressed.backgroundNeutralSubtle
    size:
      small:
        roundedRadius: borderRadius.base200
        horizontalPadding: spacing.componentBase200
        verticalPadding: spacing.componentBase100
        iconOnlyPadding: spacing.componentBase100
        gap: spacing.componentBase50
      medium:
        roundedRadius: borderRadius.base300
        horizontalPadding: spacing.componentBase250
        verticalPadding: spacing.componentBase150
        iconOnlyPadding: spacing.componentBase150
        gap: spacing.componentBase100
      large:
        roundedRadius: borderRadius.base400
        horizontalPadding: spacing.componentBase300
        verticalPadding: spacing.componentBase200
        iconOnlyPadding: spacing.componentBase250
        gap: spacing.componentBase150
    shape:
      square: cornerRadiusNone
      circle: borderRadius.circular

  content:
    layout:
      flexShrink: 1
      textAlign: center
    family: fontFamily.functional
    size:
      small:
        fontSize: fontSize.functionalBodySmall
        lineHeight: lineHeight.functionalBodySmall
      medium:
        fontSize: fontSize.functionalBodyMedium
        lineHeight: lineHeight.functionalBodyMedium
      large:
        fontSize: fontSize.functionalBodyLarge
        lineHeight: lineHeight.functionalBodyLarge
    weight:
      rest: fontWeight.functionalRegular
      selected: fontWeight.functionalSemibold

  icon:
    small:
      height: size160
      width: size160
    medium:
      height: size200
      width: size200
    large:
      height: size200
      width: size200
    color: resolved root foreground

  focusVisual:
    innerColor: color.strokeFocusInner
    innerWidth: strokeWidth.thin
    outerColor: color.strokeFocusOuter
    outerWidth: strokeWidth.thick

tokenGaps: []
