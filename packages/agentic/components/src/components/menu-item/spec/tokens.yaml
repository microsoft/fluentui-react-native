schemaVersion: 1
component: menu-item
implementation: menu-item.styles.ts

statePrecedence:
  - menuStyle
  - selectedVisual
  - disabled
  - pressed
  - hovered

bindings:
  root:
    layout:
      minHeight: global.size400
      gap: global.size160
      paddingHorizontal: 12
      paddingVertical: 10
    background:
      rest: color.backgroundNeutralTransparent
      selected: color.backgroundNeutralSoft
      selectedDisabled: color.backgroundNeutralSubtleDisabled
      multiselect: color.backgroundNeutralTransparent
  content:
    family: fontFamily.functional
    listItem: [fontSize.functionalBodyMedium, lineHeight.functionalBodyMedium]
    sectionHeader: [fontSize.functionalBodySmall, lineHeight.functionalBodySmall]
    weight:
      rest: fontWeight.functionalRegular
      selected: fontWeight.functionalSemibold
      sectionHeader: fontWeight.functionalSemibold
    foreground:
      primary: color.foregroundNeutralPrimary
      secondary: color.foregroundNeutralSecondary
      disabled: color.foregroundNeutralDisabled
  secondaryContent:
    listItem: [fontSize.functionalBodySmall, lineHeight.functionalBodySmall]
    selectedWeight: fontWeight.functionalSemibold
  indicators:
    icon: 20
    checkmark: 16
    avatar: 16
    multiselect:
      size: global.size160
      selectedBackground: color.backgroundBrandHeavy
      selectedForeground: color.foregroundBrandOnloud
      unselectedBorder: color.strokeNeutralLoud
  focusVisual:
    outer: [color.strokeFocusOuter, strokeWidth.thick]
    inner: [color.strokeFocusInner, strokeWidth.thin]

tokenGaps: []
