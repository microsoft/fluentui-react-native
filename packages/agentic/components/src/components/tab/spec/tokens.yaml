schemaVersion: 1
component: tab
implementation: tab.styles.ts

statePrecedence:
  - base
  - selected
  - disabled
  - pressed
  - hovered

notes:
  colorLevels: getThemedColorStyleFactory is configured with a selected level followed by the shared interactiveStatePriority level, so selected picks the color family and disabled, pressed, and hovered refine it.
  layoutLevels: Root radius and padding are resolved from the layout level alone and do not vary with interaction state.

bindings:
  root:
    static:
      alignItems: center
      alignSelf: flex-start
      flexDirection: row
      justifyContent: center
    layout:
      iconAndText:
        borderRadius: borderRadius.base300
        gap: spacing.componentBase100
        paddingHorizontal: spacing.componentBase300
        paddingVertical: spacing.componentBase150
      iconOnly:
        borderRadius: borderRadius.circular
        paddingHorizontal: spacing.componentBase150
        paddingVertical: spacing.componentBase150
    backgroundColor:
      base: color.backgroundNeutralTransparent
      disabled: color.backgroundNeutralTransparent
      selected: color.backgroundNeutralHeavy
      selectedDisabled: color.backgroundNeutralHeavyDisabled
    userStyle: applied last by useTabStyles_unstable

  focusVisual:
    borderRadius: resolved layout borderRadius
    innerColor: color.strokeFocusInner
    innerWidth: strokeWidth.thin
    outerColor: color.strokeFocusOuter
    outerWidth: strokeWidth.thick
    visible: focused and not disabled

  icon:
    slots:
      - icon
      - selectedIcon
    color: resolved content color
    height: 20
    width: 20
    accessible: false

  content:
    static:
      flexShrink: 1
      textAlign: center
    themed:
      fontFamily: fontFamily.functional
      fontSize: fontSize.functionalBodyMedium
      fontWeight: fontWeight.functionalRegular
      lineHeight: lineHeight.functionalBodyMedium
    selected:
      fontWeight: fontWeight.functionalSemibold
    color:
      base: color.foregroundNeutralPrimary
      disabled: color.foregroundNeutralDisabled
      selected: color.foregroundNeutralOnloud
      selectedDisabled: color.foregroundNeutralDisabled

  contentHidden:
    inherits: content
    fontWeight: fontWeight.functionalSemibold at every selection state, so the reserved width never changes
    opacity: 0
    role: internal width reservation, hidden from assistive technology

tokenGaps:
  - id: tab-icon-size
    binding: icon.height and icon.width
    value: 20
    reason: getTabIconSize returns a literal because this package publishes no icon sizing scale.
  - id: tab-selection-indicator
    binding: root
    value: none
    reason: Selection is expressed with a filled background and a heavier label rather than a separate indicator element, so no indicator size, color, or radius token is bound.
  - id: tab-single-size
    binding: root.padding and content.fontSize
    value: one size only
    reason: The component exposes no size axis, so there is no small or large token set to bind.
