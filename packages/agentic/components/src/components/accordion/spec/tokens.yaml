schemaVersion: 1
component: accordion
implementation: accordion.styles.ts

statePrecedence:
  - pressed
  - hovered

bindings:
  root:
    layout:
      alignSelf: stretch
      width: 100%
    userStyle: applied after root structural style
  header:
    size:
      small:
        borderRadius: borderRadius.base200
        gap: spacing.componentBase100
        paddingHorizontal: spacing.componentBase200
        paddingVertical: spacing.componentBase100
    background:
      rest: color.backgroundNeutralTransparent
      hovered: color.hover.backgroundNeutralSubtle
      pressed: color.pressed.backgroundNeutralSubtle
  title:
    small:
      fontFamily: fontFamily.functional
      fontSize: fontSize.functionalBodySmall
      fontWeight: fontWeight.functionalSemibold
      lineHeight: lineHeight.functionalBodySmall
      color: color.foregroundNeutralPrimary
  body:
    small:
      paddingHorizontal: spacing.componentBase200
      paddingTop: spacing.componentBase200
      foreground: color.foregroundNeutralPrimary
      typography:
        fontFamily: fontFamily.functional
        fontSize: fontSize.functionalBodySmall
        fontWeight: fontWeight.functionalRegular
        lineHeight: lineHeight.functionalBodySmall
    collapsed:
      height: 0
      opacity: 0
      overflow: hidden
      paddingHorizontal: 0
      paddingTop: 0
    expanded:
      opacity: 1
      overflow: visible
  icons:
    leadingIcon: size160
    chevron: size160
    color: resolved header foreground
  focusVisual:
    innerColor: color.strokeFocusInner
    innerWidth: strokeWidth.thin
    outerColor: color.strokeFocusOuter
    outerWidth: strokeWidth.thick
    radius: resolved header border radius

tokenGaps:
  - property: icon dimensions
    binding: size160 global token
    reason: the mapped Flex token groups do not provide the component icon dimension.
