schemaVersion: 1
component: checkbox
implementation: checkbox.styles.ts

# Interaction colors are declared once per status. The `hovered` and `pressed`
# entries resolve the same semantic color key through the `color.hover` and
# `color.pressed` sub-palettes, so no separate interaction token names appear
# in the definitions below.
statePrecedence:
  - status
  - disabled
  - pressed
  - hovered

bindings:
  root:
    layout:
      alignItems: center
      alignSelf: flex-start
      borderStyle: solid
      flexDirection: row
      justifyContent: flex-start
      minHeight: size240
      minWidth: size240
    gap:
      withLabel: spacing.componentBase100
      iconOnly: 0

  indicator:
    layout:
      alignItems: center
      borderStyle: solid
      justifyContent: center
      borderWidth: strokeWidth.thin
      height: size160
      width: size160
      marginVertical: spacing.componentBase200
    variant:
      standard: borderRadius.base100
      circular: borderRadius.circular
    color:
      unchecked:
        backgroundColor: color.backgroundNeutralTransparent
        borderColor: color.strokeNeutralHeavy
      checked:
        backgroundColor: color.backgroundBrandHeavy
        borderColor: color.strokeNeutralTransparent
      indeterminate:
        backgroundColor: color.backgroundBrandHeavy
        borderColor: color.strokeNeutralTransparent
      disabled:
        backgroundColor: color.backgroundNeutralTransparent
        borderColor: color.strokeNeutralDisabled
      checkedDisabled:
        backgroundColor: color.backgroundNeutralHeavyDisabled
        borderColor: color.strokeNeutralTransparent
      indeterminateDisabled:
        backgroundColor: color.backgroundNeutralHeavyDisabled
        borderColor: color.strokeNeutralTransparent

  indicatorIcon:
    height: size120
    width: size120
    color:
      unchecked: color.foregroundBrandOnloud
      checked: color.foregroundBrandOnloud
      indeterminate: color.foregroundBrandOnloud
      disabled: color.foregroundNeutralDisabled

  labelContainer:
    layout:
      alignItems: flex-start
      flexDirection: column
      flexShrink: 1
      justifyContent: center
      paddingEnd: spacing.componentBase200
      paddingVertical: spacing.componentBase150
    gap:
      withSecondaryText: spacing.componentBase50
      withoutSecondaryText: none

  label:
    layout:
      flexShrink: 1
    typography:
      fontFamily: fontFamily.functional
      fontSize: fontSize.functionalBodyMedium
      fontWeight: fontWeight.functionalRegular
      lineHeight: lineHeight.functionalBodyMedium
    color:
      unchecked: color.foregroundNeutralSecondary
      checked: color.foregroundNeutralPrimary
      indeterminate: color.foregroundNeutralPrimary
      disabled: color.foregroundNeutralDisabled

  secondaryText:
    layout:
      flexShrink: 1
    typography:
      fontFamily: fontFamily.functional
      fontSize: fontSize.functionalBodySmall
      fontWeight: fontWeight.functionalRegular
      lineHeight: lineHeight.functionalBodySmall
    color:
      unchecked: color.foregroundNeutralSecondary
      checked: color.foregroundNeutralSecondary
      indeterminate: color.foregroundNeutralSecondary
      disabled: color.foregroundNeutralDisabled

  focusVisual:
    implementation: useCheckboxStyles.ts
    borderRadius: borderRadius.base300
    innerColor: color.strokeFocusInner
    innerWidth: strokeWidth.thin
    outerColor: color.strokeFocusOuter
    outerWidth: strokeWidth.thick

tokenGaps:
  - binding: root.layout.minHeight, root.layout.minWidth
    detail: The 24 by 24 press-target minimum comes from the global size240 constant, not from a component spacing token.
  - binding: indicator.layout.height, indicator.layout.width
    detail: The 16 by 16 indicator box comes from the global size160 constant, not from a component sizing token.
  - binding: indicatorIcon.height, indicatorIcon.width
    detail: The 12 by 12 glyph size is re-exported from the global size120 constant in checkbox.styles.ts rather than bound to a component token.
