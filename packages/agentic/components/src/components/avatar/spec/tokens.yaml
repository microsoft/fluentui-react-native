schemaVersion: 1
component: avatar
implementation: avatar.styles.ts

statePrecedence:
  - contentMode
  - activityRing

bindings:
  root:
    allSizes:
      borderRadius: borderRadius.circular
      backgroundColor: color.backgroundNeutralSoft
      alignment: center
    image:
      backgroundColor: color.backgroundNeutralTransparent
      padding: 0
    size:
      '16': { padding: spacing.componentBase50, diameter: 16 }
      '20': { padding: spacing.componentBase50, diameter: 20 }
      '24': { padding: spacing.componentBase100, diameter: 24 }
      '28': { padding: spacing.componentBase150, diameter: 28 }
      '32': { padding: spacing.componentBase100, diameter: 32 }
      '40': { padding: spacing.componentBase200, diameter: 40 }
      '56': { padding: spacing.componentBase300, diameter: 56 }
      '120': { padding: spacing.layoutBase400, diameter: 120 }
  initials:
    color: color.foregroundNeutralPrimary
    fontFamily: fontFamily.functional
    fontWeight: fontWeight.functionalRegular
    size:
      '16': { fontSize: fontSize.functionalCaption, lineHeight: fontSize.functionalCaption }
      '20': { fontSize: fontSize.functionalCaption, lineHeight: fontSize.functionalCaption }
      '24': { fontSize: fontSize.functionalCaption, lineHeight: fontSize.functionalCaption }
      '28': { fontSize: fontSize.functionalBodySmall, lineHeight: fontSize.functionalBodySmall }
      '32': { fontSize: fontSize.functionalBodyMedium, lineHeight: fontSize.functionalBodyMedium }
      '40': { fontSize: fontSize.functionalBodyLarge, lineHeight: fontSize.functionalBodyLarge }
      '56': { fontSize: fontSize.functionalTitleSmall, lineHeight: fontSize.functionalTitleSmall }
      '120': { fontSize: fontSize.functionalTitleLarge, lineHeight: fontSize.functionalTitleLarge }
  icon:
    color: color.foregroundNeutralPrimary
    size: { '16': 12, '20': 16, '24': 16, '28': 16, '32': 20, '40': 24, '56': 32, '120': 48 }
  activityRing:
    color: color.strokeBrandLoud
    '16': { offset: strokeWidth.thin, width: strokeWidth.thin }
    '20': { offset: strokeWidth.thin, width: strokeWidth.thick }
    '24': { offset: strokeWidth.thin, width: strokeWidth.thick }
    '28': { offset: strokeWidth.thin, width: strokeWidth.thick }
    '32': { offset: strokeWidth.thin, width: strokeWidth.thick }
    '40': { offset: strokeWidth.thin, width: strokeWidth.thick }
    '56': { offset: strokeWidth.thin, width: strokeWidth.thicker }
    '120': { offset: strokeWidth.thick, width: strokeWidth.thicker }

tokenGaps:
  - property: icon size
    values: [12, 16, 20, 24, 32, 48]
    reason: avatar icon dimensions are implementation constants rather than mapped Flex token values.
