schemaVersion: 1
component: badge
implementation: badge.styles.ts

statePrecedence:
  - appearance
  - color
  - size
  - shape
  - layout

bindings:
  root:
    layout:
      alignment: center
      borderStyle: solid
      direction: row
    tint:
      brand: { backgroundColor: color.backgroundBrandSoft, borderColor: color.strokeNeutralTransparent }
      danger: { backgroundColor: color.backgroundDangerSoft, borderColor: color.strokeNeutralTransparent }
      success: { backgroundColor: color.backgroundSuccessSoft, borderColor: color.strokeNeutralTransparent }
      warning: { backgroundColor: color.backgroundWarningSoft, borderColor: color.strokeNeutralTransparent }
      informative: { backgroundColor: color.backgroundNeutralSoft, borderColor: color.strokeNeutralTransparent }
    outline:
      backgroundColor: color.backgroundNeutralTransparent
      borderWidth: strokeWidth.thin
      borderColor:
        brand: color.strokeBrandLoud
        danger: color.strokeDangerLoud
        success: color.strokeSuccessLoud
        warning: color.strokeWarningLoud
        informative: color.strokeNeutralLoud
    shape:
      circular: borderRadius.circular
      roundedSmall: borderRadius.base100
      roundedMedium: borderRadius.base200
    size:
      small: { minHeight: 16, iconAndTextPadding: spacing.componentBase100, gap: spacing.componentBase50 }
      medium: { minHeight: 20, iconAndTextPadding: spacing.componentBase150, gap: spacing.componentBase50 }
    iconOnly:
      small: { minWidth: 16, paddingHorizontal: 0 }
      medium: { minWidth: 20, paddingHorizontal: 0 }
  content:
    fontFamily: fontFamily.functional
    fontWeight: fontWeight.functionalRegular
    small: { fontSize: fontSize.functionalCaption, lineHeight: lineHeight.functionalCaption }
    medium: { fontSize: fontSize.functionalBodySmall, lineHeight: lineHeight.functionalBodySmall }
    color:
      brand: color.foregroundBrandPrimary
      danger: color.foregroundDangerPrimary
      success: color.foregroundSuccessPrimary
      warning: color.foregroundWarningPrimary
      informative: color.foregroundNeutralPrimary
  icons:
    color: resolved content foreground
    small: 12
    medium: 16

tokenGaps:
  - property: badge and icon dimensions
    values: [12, 16, 20]
    reason: implementation uses fixed dimensions because no mapped FURN Flex dimension token exists.
