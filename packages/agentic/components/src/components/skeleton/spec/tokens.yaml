schemaVersion: 1
component: skeleton
implementation: skeleton.styles.ts

statePrecedence:
  - static
  - theme
  - userStyle

bindings:
  root:
    static:
      overflow: hidden
      position: relative
    theme:
      backgroundColor: color.backgroundNeutralSubtle
      borderRadius: borderRadius.base100
    userStyle: applied last by useSkeletonStyles_unstable

  shimmerContainer:
    static:
      position: absolute
      top: 0
      bottom: 0
      left: 0
      overflow: hidden
      pointerEvents: none
    instance:
      width: band width derived from the measured root width
      transform: translateX from minus the band width to the measured width plus the band width

  shimmerBand:
    static:
      height: 100%
      opacity: 0.64
    theme:
      backgroundColor: color.backgroundNeutralSoft
      borderRadius: borderRadius.base100

motion:
  implementation: useSkeleton.ts
  driver: Animated.loop over Animated.timing with useNativeDriver true
  duration: 1700
  easing: linear
  gate: measured width and height are both greater than zero and reduced motion is off

tokenGaps:
  - id: skeleton-band-opacity
    binding: shimmerBand.opacity
    value: 0.64
    reason: The highlight lift is a literal opacity in styling code because no theme token covers it.
  - id: skeleton-band-width
    binding: shimmerContainer.width
    value: 45 percent of the measured width with a floor of 24
    reason: The band proportion and its minimum are literals in useSkeleton.ts with no token coverage.
  - id: skeleton-sweep-duration
    binding: motion.duration
    value: 1700
    reason: This package publishes no motion tokens, so the loop duration is a literal.
