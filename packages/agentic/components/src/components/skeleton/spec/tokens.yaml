schemaVersion: 1
component: skeleton
implementation: skeleton.styles.ts

statePrecedence:
  - static
  - theme
  - userStyle

bindings:
  root:
    static:
      overflow: hidden
      position: relative
    theme:
      backgroundColor: color.backgroundNeutralSoft
      borderRadius: borderRadius.base100
      opaqueHighlight:
        borderColor: color.strokeNeutralLoud
        borderWidth: strokeWidth.thin
    userStyle: applied last by useSkeletonStyles_unstable

  shimmerContainer:
    static:
      position: absolute
      top: 0
      bottom: 0
      left: 0
      overflow: hidden
      pointerEvents: none
    instance:
      width: band width plus the measured root height
      transform: translateX from minus the overlay width to the measured root width, reversed in RTL

  shimmerGradient:
    theme:
      stopColor: color.backgroundNeutralSubtle
    geometry:
      gradientUnits: userSpaceOnUse
      x1: measured root height
      y1: 0
      x2: measured root height plus half the band width
      y2: half the band width
    stops:
      - offset: 0
        opacity: 0
      - offset: 0.5
        opacity: 0.64
      - offset: 1
        opacity: 0

motion:
  implementation: useSkeleton.ts
  driver: shared Animated.loop requests native animation; macOS Fabric uses the JavaScript driver
  duration: 1700
  easing: linear
  gate: measured width and height are both greater than zero, reduced motion is off, and the highlight is a concrete color string

tokenGaps:
  - id: skeleton-band-opacity
    binding: shimmerGradient.stops
    value: 0.64
    reason: The highlight lift is a literal opacity in styling code because no theme token covers it.
  - id: skeleton-band-width
    binding: shimmerContainer.width
    value: 45 percent of the measured width with a floor of 24
    reason: The band proportion and its minimum are literals in useSkeleton.ts with no token coverage.
  - id: skeleton-gradient-angle
    binding: shimmerGradient.geometry
    value: 45 degrees
    reason: A fixed diagonal wave satisfies the local loading contract without adding Shimmer's configurable angle API.
  - id: skeleton-sweep-duration
    binding: motion.duration
    value: 1700
    reason: This package publishes no motion tokens, so the loop duration is a literal.
