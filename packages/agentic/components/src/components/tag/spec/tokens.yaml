schemaVersion: 1
component: tag
implementation: tag.styles.ts

statePrecedence:
  background:
    - appearance
    - disabled
    - pressed
    - hovered
  foreground:
    - appearance
    - disabled
  layout:
    - size
    - layout
    - shape

notes:
  foregroundIsStable: The foreground factory is configured with only an appearance level and a disabled level, so hover and pressed change the background alone.
  iconOnlyShape: getRootStyleSource substitutes the circular branch for every icon-only tag, so the shape prop has no effect in that layout.

bindings:
  root:
    static:
      alignItems: center
      alignSelf: flex-start
      flexDirection: row
      justifyContent: center
    themedBase:
      borderWidth: 0
      minHeight: 24
      minWidth: 24
    backgroundColor:
      primary: color.backgroundBrandHeavy
      primaryDisabled: color.backgroundNeutralHeavyDisabled
      secondary: color.backgroundNeutralSubtle
      secondaryDisabled: color.backgroundNeutralSubtleDisabled
    userStyle: applied last by useTagStyles_unstable

  focusVisual:
    borderRadius: resolved root borderRadius
    innerColor: color.strokeFocusInner
    innerWidth: strokeWidth.thin
    outerColor: color.strokeFocusOuter
    outerWidth: strokeWidth.thick
    visible: focused and not disabled

  content:
    static:
      flexShrink: 1
      textAlign: center
    themed:
      fontFamily: fontFamily.functional
      paddingHorizontal: spacing.componentBase50
    small:
      fontSize: fontSize.functionalBodySmall
      fontWeight: fontWeight.functionalRegular
      lineHeight: lineHeight.functionalBodySmall
    medium:
      fontSize: fontSize.functionalBodyMedium
      fontWeight: fontWeight.functionalRegular
      lineHeight: lineHeight.functionalBodyMedium
    color:
      primary: color.foregroundNeutralOnloud
      secondary: color.foregroundNeutralPrimary
      disabled: color.foregroundNeutralDisabled

  leadingIcon:
    static:
      flexShrink: 0
    color: resolved content color
    accessible: false
    size:
      small: 16
      medium: 20

  dismissIcon:
    static:
      flexShrink: 0
    color: resolved content color
    accessible: false
    size:
      small: 12
      medium: 16

layout:
  small:
    iconAndText:
      rounded:
        borderRadius: borderRadius.base200
        gap: spacing.componentBase50
        paddingHorizontal: spacing.componentBase200
        paddingVertical: spacing.componentBase100
      circular:
        borderRadius: borderRadius.circular
        gap: spacing.componentBase50
        paddingHorizontal: spacing.componentBase200
        paddingVertical: spacing.componentBase100
    iconOnly:
      borderRadius: borderRadius.circular
      gap: 0
      paddingHorizontal: spacing.componentBase100
      paddingVertical: spacing.componentBase100
  medium:
    iconAndText:
      rounded:
        borderRadius: borderRadius.base300
        gap: spacing.componentBase50
        paddingHorizontal: spacing.componentBase250
        paddingVertical: spacing.componentBase150
      circular:
        borderRadius: borderRadius.circular
        gap: spacing.componentBase50
        paddingHorizontal: spacing.componentBase250
        paddingVertical: spacing.componentBase150
    iconOnly:
      borderRadius: borderRadius.circular
      gap: spacing.componentBase50
      paddingHorizontal: spacing.componentBase150
      paddingVertical: spacing.componentBase150

tokenGaps:
  - id: tag-icon-sizes
    binding: leadingIcon.size and dismissIcon.size
    value: 12, 16, and 20
    reason: getTagIconSize returns literals because this package publishes no icon sizing scale.
  - id: tag-minimum-box
    binding: root.minHeight and root.minWidth
    value: 24
    reason: The minimum box is a literal in the style definition and is not drawn from the sizing scale.
  - id: tag-state-motion
    binding: root.backgroundColor
    value: no transition
    reason: This package publishes no motion tokens, so interaction color changes are applied without a duration or easing.
