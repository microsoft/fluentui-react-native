schemaVersion: 1
component: input
implementation: input.styles.ts

# The boundary state and additive focus-visible indicator are resolved separately.
statePrecedence:
  - disabled
  - error
  - readOnly
  - focused
  - pressed
  - hovered
  - rest

bindings:
  root:
    layout:
      alignSelf: stretch
      flexDirection: column
      overflow: hidden
    variant:
      outline:
        borderRadius:
          small: borderRadius.base200
          medium: borderRadius.base300
          large: borderRadius.base400
      underline:
        borderRadius: cornerRadiusNone

  contents:
    layout:
      alignItems: center
      backgroundColor: transparent
      borderStyle: solid
      flexDirection: row
      overflow: hidden
      position: relative
    gap:
      small: spacing.componentBase250
      medium: spacing.componentBase250
      large: spacing.componentBase250
    minHeight:
      small: lineHeight.functionalBodySmall + spacing.componentBase100 * 2
      medium: lineHeight.functionalBodyMedium + spacing.componentBase150 * 2
      large: lineHeight.functionalBodyLarge + spacing.componentBase200 * 2
    strokeWidth:
      outline:
        borderWidth: strokeWidth.thin
      underline:
        borderWidth: 0
    strokeColor:
      # Applied as borderColor for outline and borderBottomColor for underline.
      disabled: color.strokeNeutralDisabled
      error: color.strokeDangerLoud
      readOnly: color.strokeNeutralDisabled
      focused:
        outline: color.strokeNeutralSubtle
        underline: color.strokeFocusOuter
      pressed: color.strokeNeutralLoud.pressed
      hovered: color.strokeNeutralLoud.hover
      rest: color.strokeNeutralLoud

  iconTextStack:
    layout:
      alignItems: center
      flexDirection: row
      flexGrow: 1
      flexShrink: 1
      minWidth: 0
    gap:
      small: spacing.componentBase250
      medium: spacing.componentBase250
      large: spacing.componentBase250
    paddingHorizontal:
      small: spacing.componentBase150
      medium: spacing.componentBase250
      large: spacing.componentBase300

  iconEnd:
    layout:
      alignItems: center
      flexDirection: row
      flexShrink: 0
      minWidth: 0
    gap:
      small: spacing.componentBase100
      medium: spacing.componentBase100
      large: spacing.componentBase100
    paddingRight:
      small: spacing.componentBase150
      medium: spacing.componentBase250
      large: spacing.componentBase300

  textInput:
    layout:
      backgroundColor: transparent
      borderWidth: 0
      flexGrow: 1
      flexShrink: 1
      minWidth: 0
      padding: 0
    typography:
      fontFamily: fontFamily.functional
      fontSize:
        small: fontSize.functionalBodySmall
        medium: fontSize.functionalBodyMedium
        large: fontSize.functionalBodyLarge
      # Native single-line metrics are intrinsic. Line-height tokens size contents.minHeight.
    marginVertical:
      small: spacing.componentBase100
      medium: spacing.componentBase150
      large: spacing.componentBase200
    color:
      disabled: color.foregroundNeutralDisabled
      default: color.foregroundNeutralPrimary

  placeholder:
    placeholderTextColor:
      disabled: color.foregroundNeutralDisabled
      readOnly: color.foregroundNeutralPrimary
      default: color.foregroundNeutralTertiary

  icons:
    # iconStart, iconEnd1, and iconEnd2 share one size and one color.
    size:
      small: size160
      medium: size200
      large: size240
    color: inherited from textInput.color

  underline:
    renderedWhen: variant is underline
    layout:
      bottom: 0
      left: 0
      position: absolute
      right: 0
    borderBottomWidth: strokeWidth.thin
    borderBottomColor: same mapping as contents.strokeColor

  FocusRing:
    renderedWhen: variant is outline
    visibleWhen: focused, keyboard modality, and not disabled
    outer: [color.strokeFocusOuter, strokeWidth.thick]
    inner: [color.strokeFocusInner, strokeWidth.thin]
    borderRadius: same mapping as root.variant.outline.borderRadius

  underlineFocus:
    renderedWhen: variant is underline
    visibleWhen: focused, keyboard modality, and not disabled
    borderBottomWidth: strokeWidth.thin
    borderBottomColor: color.strokeFocusOuter
    bottom: strokeWidth.thin

tokenGaps:
  - binding: icons.color
    detail: The icon color is inherited from the resolved text color rather than bound to its own foreground token, so a disabled field dims the icons only because the text color changed.
  - binding: contents.gap, iconEnd.gap
    detail: The contents gap and the trailing icon gap resolve to the same value for all three sizes, so the size axis carries no distinction for these two bindings.
