schemaVersion: 1
component: radio
implementation: radio.styles.ts

statePrecedence:
  - selected
  - disabled
  - pressed
  - hovered

bindings:
  root:
    backgroundColor: color.backgroundNeutralTransparent
    borderRadius: borderRadius.base300
    gap: spacing.componentBase100
  indicator:
    size: 16
    radius: 8
    margin: spacing.componentBase200
    borderWidth: strokeWidth.thin
    border:
      rest: color.strokeNeutralHeavy
      selected: color.strokeBrandLoud
      disabled: color.strokeNeutralDisabled
  dot:
    size: 10
    radius: 5
    visibleWhen: selected
    background:
      selected: color.foregroundBrandPrimary
      disabled: color.foregroundNeutralDisabled
  label:
    typography: [fontFamily.functional, fontSize.functionalBodyMedium, fontWeight.functionalRegular, lineHeight.functionalBodyMedium]
    color:
      unselected: color.foregroundNeutralSecondary
      selected: color.foregroundNeutralPrimary
      disabled: color.foregroundNeutralDisabled
  secondaryText:
    typography: [fontFamily.functional, fontSize.functionalBodySmall, fontWeight.functionalRegular, lineHeight.functionalBodySmall]
    color:
      rest: color.foregroundNeutralSecondary
      disabled: color.foregroundNeutralDisabled
  labelContainer:
    gap: spacing.componentBase50
    paddingEnd: spacing.componentBase200
    paddingVertical: spacing.componentBase150
  focusVisual:
    outer: [color.strokeFocusOuter, strokeWidth.thick]
    inner: [color.strokeFocusInner, strokeWidth.thin]

tokenGaps: []
