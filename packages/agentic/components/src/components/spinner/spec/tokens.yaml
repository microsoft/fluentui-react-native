schemaVersion: 1
component: spinner
implementation: spinner.styles.ts

statePrecedence:
  - static
  - size
  - userStyle

bindings:
  root:
    static:
      alignItems: center
      justifyContent: center
      flexShrink: 0
    instance:
      height: resolved diameter
      width: resolved diameter
    userStyle: applied last by useSpinnerStyles_unstable

  svg:
    static:
      flexShrink: 0
    instance:
      height: resolved diameter
      width: resolved diameter
      viewBox: square box of the resolved diameter
      accessible: false
    motion:
      transform: rotate interpolated from 0deg to 360deg while reduced motion is known to be off

  track:
    stroke: color.strokeNeutralSubtle
    strokeWidth: resolved size stroke width token
    strokeLinecap: round
    fill: none

  indicator:
    stroke: color.strokeNeutralLoud
    strokeWidth: resolved size stroke width token
    strokeLinecap: round
    fill: none
    pathLength: 100
    strokeDasharray: 25 visible units and 75 gap units of the normalized path length

geometry:
  implementation: getSpinnerMetrics in spinner.styles.ts
  center: half of the diameter
  radius: half of the diameter minus half of the stroke width

size:
  x-tiny:
    diameter: 16
    strokeWidth: strokeWidth.thin
  tiny:
    diameter: 20
    strokeWidth: strokeWidth.thin
  x-small:
    diameter: 24
    strokeWidth: strokeWidth.thin
  small:
    diameter: 28
    strokeWidth: strokeWidth.thick
  medium:
    diameter: 32
    strokeWidth: strokeWidth.thick
  large:
    diameter: 36
    strokeWidth: strokeWidth.thicker
  x-large:
    diameter: 40
    strokeWidth: strokeWidth.thicker
  huge:
    diameter: 44
    strokeWidth: strokeWidth.thicker

motion:
  implementation: useSpinner.ts
  driver: Animated.loop over Animated.timing with useNativeDriver true
  duration: 1500
  easing: linear

tokenGaps:
  - id: spinner-diameters
    binding: size.diameter
    value: 16 through 44
    reason: Diameters are intrinsic to the component and have no coverage in the spacing or sizing scales.
  - id: spinner-arc-fraction
    binding: indicator.strokeDasharray
    value: one quarter of the normalized path length
    reason: The visible arc fraction is a design constant expressed directly in the render code.
  - id: spinner-rotation-duration
    binding: motion.duration
    value: 1500
    reason: This package publishes no motion tokens, so the rotation duration is a literal.
