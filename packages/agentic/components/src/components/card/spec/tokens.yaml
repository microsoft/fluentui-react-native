schemaVersion: 1
component: card
implementation: card.styles.ts

statePrecedence:
  - selected
  - disabled
  - pressed
  - hovered

bindings:
  root:
    layout:
      borderStyle: solid
      maxWidth: 720
      overflow: hidden
    surface:
      rest:
        backgroundColor: color.surfaceNeutralTranslucent
        borderColor: color.strokeNeutralSubtle
      selected:
        backgroundColor: color.backgroundNeutralSoft
        borderColor: color.strokeNeutralSoft
      disabled:
        backgroundColor: color.backgroundNeutralDisabled
        borderColor: color.strokeNeutralDisabled
      hovered: color.hover
      pressed: color.pressed
    size:
      small:
        borderRadius: borderRadius.base600
        borderWidth: strokeWidth.thin
      large:
        borderRadius: borderRadius.base700
        borderWidth: strokeWidth.thin
    padding:
      default: spacing.componentBase300
      none: 0
    gap: spacing.componentBase300
  nestedContent:
    backgroundColor: color.backgroundNeutralTranslucent
    small:
      default: borderRadius.base300
      none: borderRadius.base600
    large:
      default: borderRadius.base400
      none: borderRadius.base700
  overlay:
    radius:
      small: borderRadius.base600
      large: borderRadius.base700
  focusVisual:
    innerColor: color.strokeFocusInner
    innerWidth: strokeWidth.thin
    outerColor: color.strokeFocusOuter
    outerWidth: strokeWidth.thick
    visibleWhen: focused and not disabled

tokenGaps:
  - property: responsive direction threshold
    value: 480
    reason: horizontal collapse is a window-width behavior, not a FURN token binding.
  - property: root maximum width
    value: 720
    reason: the structural maximum width is an implementation constant.
