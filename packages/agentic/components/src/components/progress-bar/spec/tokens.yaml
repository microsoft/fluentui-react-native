schemaVersion: 1
component: progress-bar
implementation: progress-bar.styles.ts

# ProgressBar is non-interactive, so there is no hover, pressed, focused, or
# disabled axis. The only axis that changes a token binding is status, and it
# changes exactly one color that two slots share.
statePrecedence:
  - status

bindings:
  root:
    implementation: progress-bar.styles.ts getProgressBarThemeStyles
    layout:
      alignSelf: stretch
      flexShrink: 1

  header:
    layout:
      alignItems: center
      flexDirection: row
      minWidth: 0
      gap: spacing.componentBase100

  label:
    layout:
      flexShrink: 1
      minWidth: 0
    typography:
      fontFamily: fontFamily.functional
      fontSize: fontSize.functionalBodyMedium
      lineHeight: lineHeight.functionalBodyMedium
    color: color.foregroundNeutralPrimary

  trailing:
    layout:
      alignItems: center
      flexDirection: row
      flexShrink: 0
      gap: spacing.componentBase100

  validationIcon:
    implementation: useProgressBarStyles.ts
    height: size160
    width: size160
    color:
      neutral: color.foregroundBrandPrimary
      error: color.foregroundDangerPrimary
      success: color.foregroundSuccessPrimary

  valueText:
    typography:
      fontFamily: fontFamily.functional
      fontSize: fontSize.functionalBodySmall
      lineHeight: lineHeight.functionalBodySmall
    color: color.foregroundNeutralSecondary

  track:
    backgroundColor: color.backgroundNeutralSoft
    borderRadius: cornerRadiusCircular
    height: spacing.componentBase100
    layout:
      overflow: hidden
      position: relative

  indicator:
    implementation: useProgressBarStyles.ts
    layout:
      bottom: 0
      left: 0
      position: absolute
      top: 0
    borderRadius: cornerRadiusCircular
    backgroundColor:
      # Shared with validationIcon.color, so the status signal reads the same
      # on both surfaces.
      neutral: color.foregroundBrandPrimary
      error: color.foregroundDangerPrimary
      success: color.foregroundSuccessPrimary
    width: measured track width times the resolved value, or a fixed segment when indeterminate

tokenGaps:
  - binding: root.gap
    detail: There is no token binding for the space between the header row and the track. The two rows are adjacent with no gap.
  - binding: track.height
    detail: The bar thickness reuses the spacing token used for the header and trailing gaps, so it cannot be tuned without moving those gaps.
  - binding: indicator.width
    detail: The indicator width is computed from the measured track width rather than resolved from a token, and the indeterminate segment ratio and its minimum are literals in useProgressBar.ts.
  - binding: indicator.transition
    detail: The determinate value transition duration and easing are expressed as web-only style keys, so they resolve to no token binding on Windows or macOS.
  - binding: label.fontWeight, valueText.fontWeight
    detail: Neither text style binds a font weight token, so both fall back to the platform default weight.
