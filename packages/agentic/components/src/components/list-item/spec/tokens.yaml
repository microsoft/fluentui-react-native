schemaVersion: 1
component: list-item
implementation: list-item.styles.ts

statePrecedence:
  - selectedFill
  - disabled
  - pressed
  - hovered

bindings:
  root:
    structural:
      alignSelf: stretch
      width: 100%
      flexDirection: row
    size:
      small:
        paddingHorizontal: spacing.componentBase200
        paddingVertical: spacing.componentBase150
      medium:
        paddingHorizontal: spacing.componentBase300
        paddingVertical: spacing.componentBase250
      large:
        paddingHorizontal: spacing.componentBase400
        paddingVertical: spacing.componentBase300
    borderRadius: borderRadius.base300
    background:
      rest: color.backgroundNeutralTransparent
      selectedFill: color.backgroundNeutralSoft
      disabled: color.backgroundNeutralTransparent
  content:
    family: fontFamily.functional
    size:
      small: [fontSize.functionalBodySmall, lineHeight.functionalBodySmall]
      medium: [fontSize.functionalBodyMedium, lineHeight.functionalBodyMedium]
      large: [fontSize.functionalBodyLarge, lineHeight.functionalBodyLarge]
    weight:
      rest: fontWeight.functionalRegular
      selected: fontWeight.functionalSemibold
    foreground:
      primary: color.foregroundNeutralPrimary
      secondary: color.foregroundNeutralSecondary
      disabled: color.foregroundNeutralDisabled
  leading:
    icon:
      small: global.size160
      medium: global.size200
      large: global.size240
    avatar:
      small: global.size200
      medium: global.size320
      large: global.size400
  focusVisual:
    outer: [color.strokeFocusOuter, strokeWidth.thick]
    inner: [color.strokeFocusInner, strokeWidth.thin]

tokenGaps: []
