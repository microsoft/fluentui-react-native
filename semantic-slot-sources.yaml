schema_version: 1
platform: win32
mappings:
  theme_driven: semantic-slots.yaml
  colored_components: colored-component-slots.yaml
guidance:
  - sources is keyed by <generation>.<component>. settings is keyed by the exact setting suffix used in the
    mapping component references.
  - Each setting reference identifies a semantic slot, exact source location, token payload, condition, and
    original declaration notes or mapping provenance when present. This preserves source-specific attribution
    even when a mapping usage has multiple contributing declarations.
  - coverage records include components without authored colors, inherited implementations, compatibility
    exports, and unsupported Win32 implementations. modifiers records source-specific opacity and visibility
    values; these are not color tokens.
  - Analysis counts span both mapping collections. Flex-contract sources are pinned planned design evidence,
    not generated runtime components or native visual qualification.
sources:
  agentic.Accessibility helpers:
    collection: theme_driven
    coverage:
      - source: packages/agentic/components/src/common/accessibility.ts
        status: no-own-colors
        notes: Accessibility/ref/testID transforms only. hideSlotProps does not hide colors or add opacity.
