          change values. Declared state order hovered < focused < pressed < disabled, after appearance. HC
          replaces the entire color recipe with flat highContrastColors for all appearances. HC
          hover/press/focus inherit ButtonText border token, but focused borderWidth=0 for all sizes; native
          ring supplies indicator. Non-HC non-primary focus likewise has borderWidth=0. Normal primary focus
          has strokeFocus2 outer and strokeFocus1 inner, rendered only after measurement. Spinner inherits
          external ActivityIndicator. Resolver provenance:
          packages/theming/win32-theme/src/paletteFromOfficeColors.ts supplies legacy Office mappings;
          createAliasesFromPalette.ts supplies modern alias projection only when createOfficeTheme.ts receives
          an explicit paletteName, and returns no overrides for HC. An optional projection does not establish
          universal Office alias equivalence. Exact slot matches describe compatible semantic roles, not equal
          alias/RGB values.'
